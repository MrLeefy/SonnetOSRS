    const d = [this.fwd[0] + this.right[0] * nx * this.tanX + this.up[0] * ny * this.tanY,
      this.fwd[1] + this.right[1] * nx * this.tanX + this.up[1] * ny * this.tanY,
      this.fwd[2] + this.right[2] * nx * this.tanX + this.up[2] * ny * this.tanY];
    const l = Math.hypot(...d); return { o: this.eye, d: [d[0] / l, d[1] / l, d[2] / l] };
  }
}

/* short stack count string colours like RS */
function stackText(n) {
  if (n >= 10000000) return { t: Math.floor(n / 1000000) + 'M', c: 0x00ff80 };
  if (n >= 100000) return { t: Math.floor(n / 1000) + 'K', c: 0xffffff };
  return { t: String(n), c: 0xffff00 };
}

/* ---- world.js ---- */
'use strict';
/* ==========================================================================
   world.js  -  procedural Grand Exchange (Varrock) map, collision, textures
   Tile coords (x east, y north). 3D: X = x, Z = -y, Y = height.
   ========================================================================== */
const MAPN = 96, GEC = 48;
const WORLD = {
  N: MAPN,
  block: new Uint8Array(MAPN * MAPN),   // 1 = blocked
  layer: new Int8Array(MAPN * MAPN).fill(-1),
  th: new Float32Array(MAPN * MAPN),    // tile-centre height
  mm: new Int32Array(MAPN * MAPN),      // minimap colour
  objs: [], trees: [], statics: [], ready: false
};
const PLAT_R = 15.5;                    // platform apothem
const STEP_H = [0, -0.11, -0.22, -0.33];
const RING_A = 8.5, RING_HL = RING_A * Math.tan(Math.PI / 8), WALL_H = 3.6;
const COL = {
  dirt: 0x867b5c, grass: 0x666f33, grass2: 0x7b8a3a, flag: 0x7f7f76, dark: 0x3d3b32, white: 0xdcd5bd, light: 0x8b8b82,
  wood: 0x6b4f2a, trunk: 0x5c4526, leaf: 0x4a6e24, red: 0x8a1c14, beige: 0xa8996f
};

function poly12(dx, dy) { let m = 0; for (let k = 0; k < 6; k++) { const a = k * Math.PI / 6; m = Math.max(m, Math.abs(dx * Math.cos(a) + dy * Math.sin(a))); } return m; }
function poly8(dx, dy) { let m = 0; for (let k = 0; k < 4; k++) { const a = k * Math.PI / 4; m = Math.max(m, Math.abs(dx * Math.cos(a) + dy * Math.sin(a))); } return m; }
function inMap(x, y) { return x >= 0 && y >= 0 && x < MAPN && y < MAPN; }
function isBlocked(x, y) { return !inMap(x, y) || WORLD.block[y * MAPN + x] === 1; }
function tileH(x, y) { x = clamp(x, 0, MAPN - 1); y = clamp(y, 0, MAPN - 1); return WORLD.th[y * MAPN + x]; }
/* bilinear ground height at float tile coords (tile centre at +0.5) */
function groundH(x, y) {
  const fx = x - 0.5, fy = y - 0.5; const ix = Math.floor(fx), iy = Math.floor(fy); const tx = fx - ix, ty = fy - iy;
  const a = tileH(ix, iy), b = tileH(ix + 1, iy), c = tileH(ix, iy + 1), d = tileH(ix + 1, iy + 1);
  return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
}

/* ---------- textures (64x64, drawn with the pixel toolkit) ---------- */
function makeWorldTextures(R) {
  const mk = (name, fn) => { const p = new Pix(64, 64); fn(p); R.makeTexture(name, p.canvas(), true); };
  mk('flag', p => {
    const r = mulberry32(7); noiseFill(p, 0, 0, 64, 64, COL.flag, 5, 11);
    for (let i = 0; i < 26; i++) { // craters
      const x = 3 + rint(58), y = 3 + rint(58), rx = 1 + rint(3), ry = 1 + rint(2);
      p.ellipse(x, y, rx, ry, 0x6c6c64); p.ellipse(x - 1, y - 1, Math.max(0, rx - 1), Math.max(0, ry - 1), 0x76766d);
    }
    for (let i = 0; i < 64; i++) { p.set(i, 0, 0x5b5b53); p.set(0, i, 0x5b5b53); p.set(i, 1, 0x8c8c83); p.set(1, i, 0x8c8c83); }
  });
  mk('dark', p => { // GE ring walls: dark ashlar blocks
    noiseFill(p, 0, 0, 64, 64, COL.dark, 7, 5);
    for (let row = 0; row < 8; row++) {
      const y = row * 8, off = (row & 1) ? 8 : 0;
      p.rect(0, y, 64, 1, 0x57554a);
      for (let x = off; x < 64 + 16; x += 16) p.rect(x % 64, y, 1, 8, 0x57554a);
      p.rect(0, y + 7, 64, 1, 0x26241e);
    }
  });
  mk('stone', p => { // Varrock city wall: light grey blocks
    noiseFill(p, 0, 0, 64, 64, COL.light, 9, 3);
    for (let row = 0; row < 4; row++) {
      const y = row * 16, off = (row & 1) ? 16 : 0;
      p.rect(0, y, 64, 1, 0x6a6a62); p.rect(0, y + 1, 64, 1, 0x9c9c93);
      for (let x = off; x < 64 + 32; x += 32) { p.rect(x % 64, y, 1, 16, 0x6a6a62); }
    }
  });
  mk('wood', p => { noiseFill(p, 0, 0, 64, 64, COL.wood, 10, 9); for (let y = 0; y < 64; y += 8) p.rect(0, y, 64, 1, 0x4d3620); });
  mk('beige', p => {
    noiseFill(p, 0, 0, 64, 64, COL.beige, 6, 13);
    for (let y = 0; y < 64; y += 16) p.rect(0, y, 64, 1, 0x877a55);
    for (let x = 0; x < 64; x += 32) p.rect(x, 0, 1, 64, 0x877a55);
  });
}

/* ---------- world generation ---------- */
function buildWorld(R) {
  const N = MAPN, C = GEC; const rng = mulberry32(20070);
  makeWorldTextures(R);
  // value noise
  const NL = 32, lat = new Float32Array(NL * NL); for (let i = 0; i < lat.length; i++) lat[i] = rng();
  const sm = t => t * t * (3 - 2 * t);
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = sm(x - xi), fy = sm(y - yi); const g = (a, b) => lat[((b & 31) * NL) + (a & 31)];
    return lerp(lerp(g(xi, yi), g(xi + 1, yi), fx), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), fx), fy);
  };
  const baseGround = (x, y) => {
    const d = poly12(x - C, y - C); let h = -0.45; const t = clamp((d - 24) / 20, 0, 1.6);
    h += t * t * 6.5 * (0.35 + vn(x * 0.11, y * 0.11)) + t * 1.3 * vn(x * 0.35 + 9, y * 0.35);
    h += (vn(x * 0.5, y * 0.5) - 0.5) * 0.05;
    return h;
  };
  const M3 = (x, y, h) => [x, h, -y];

  /* platform layers + heights */
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    const d = poly12(tx + 0.5 - C, ty + 0.5 - C); let L = -1;
    if (d <= PLAT_R) L = 0; else if (d <= PLAT_R + 1) L = 1; else if (d <= PLAT_R + 2) L = 2; else if (d <= PLAT_R + 3) L = 3;
    WORLD.layer[ty * N + tx] = L;
    WORLD.th[ty * N + tx] = L >= 0 ? STEP_H[L] : baseGround(tx + 0.5, ty + 0.5);
  }

  const S = new Mesh('white'), FL = new Mesh('flag'), DK = new Mesh('dark'), ST = new Mesh('stone'), WD = new Mesh('wood'), BG = new Mesh('beige');
  const meshes = [S, FL, DK, ST, WD, BG];

  /* terrain mesh (skips platform tiles) */
  const cornerH = (i, j) => baseGround(i, j);
  const cornerCol = (i, j) => {
    const d = poly12(i - C, j - C), n = vn(i * 0.3, j * 0.3), n2 = vn(i * 0.9 + 3, j * 0.9);
    const dirt = clamp((25.5 + 3.5 * n - d) / 3.5, 0, 1);
    let g = mixCol(COL.grass, COL.grass2, clamp(n * 1.2 - 0.2 + (d > 40 ? 0.15 : 0), 0, 1));
    let c = mixCol(g, COL.dirt, dirt);
    return shadeCol(c, 0.9 + 0.2 * n2);
  };
  const cN = (i, j) => { // corner normal light
    const e = 0.5; const hx = baseGround(i + e, j) - baseGround(i - e, j), hy = baseGround(i, j + e) - baseGround(i, j - e);
    return lightAt(-hx, 1, hy);
  };
  const litCol = (i, j) => { const c = cornerCol(i, j), f = cN(i, j); return shadeCol(c, f); };
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    if (WORLD.layer[ty * N + tx] >= 0) continue;
    const c = [litCol(tx, ty), litCol(tx + 1, ty), litCol(tx + 1, ty + 1), litCol(tx, ty + 1)];
    S.quad(M3(tx, ty, cornerH(tx, ty)), M3(tx + 1, ty, cornerH(tx + 1, ty)), M3(tx + 1, ty + 1, cornerH(tx + 1, ty + 1)), M3(tx, ty + 1, cornerH(tx, ty + 1)), c, false);
  }
  // ground under the platform (avoids seeing the void through risers)
  S.quad(M3(C - 24, C - 24, -0.5), M3(C + 24, C - 24, -0.5), M3(C + 24, C + 24, -0.5), M3(C - 24, C + 24, -0.5), 0x6b6a58, false);

  /* platform tops + risers */
  const rr = mulberry32(99);
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    const L = WORLD.layer[ty * N + tx]; if (L < 0) continue; const h = STEP_H[L];
    const v = 0.94 + rr() * 0.1; const cc = shadeCol(0xffffff, v);
    FL.quad(M3(tx, ty, h), M3(tx + 1, ty, h), M3(tx + 1, ty + 1, h), M3(tx, ty + 1, h), cc, true, [[0, 1], [1, 1], [1, 0], [0, 0]]);
    const nb = [[0, -1, 'S'], [1, 0, 'E'], [0, 1, 'N'], [-1, 0, 'W']];
    for (const [ox, oy] of nb) {
      const nx = tx + ox, ny = ty + oy; const nL = inMap(nx, ny) ? WORLD.layer[ny * N + nx] : -1;
      const nh = nL >= 0 ? STEP_H[nL] : -0.5;
      if (nh < h - 0.001) {
        let a, b;
        if (oy === -1) { a = M3(tx, ty, h); b = M3(tx + 1, ty, h); } else if (ox === 1) { a = M3(tx + 1, ty, h); b = M3(tx + 1, ty + 1, h); }
        else if (oy === 1) { a = M3(tx + 1, ty + 1, h); b = M3(tx, ty + 1, h); } else { a = M3(tx, ty + 1, h); b = M3(tx, ty, h); }
        FL.quad([a[0], nh, a[2]], [b[0], nh, b[2]], b, a, 0xd0d0c8, true, [[0, 0.5], [1, 0.5], [1, 0.4], [0, 0.4]]);
      }
    }
  }

  /* ---------- ring of 8 arched walls around the tower ---------- */
  const hl = RING_HL, aw = 1.6, ys = 1.5, th = 0.72, top = WALL_H;
  const edgeXf = (cx, cy, phi) => {
    const s = Math.sin(phi), c = Math.cos(phi);
    return [-s, 0, -c, 0, 0, 1, 0, 0, c, 0, -s, 0, cx, 0, -cy, 1];
  };
  const P = (u, v, w) => [u, v, w];
  function archPanel(m) {
    const hw = th / 2;
    // stubs
    DK.box(m, -(hl + aw) / 2, top / 2, 0, (hl - aw) / 2, top / 2, hw, 0xffffff, 0.5);
    DK.box(m, (hl + aw) / 2, top / 2, 0, (hl - aw) / 2, top / 2, hw, 0xffffff, 0.5);
    // lintel slices
    const n = 12;
    for (let i = 0; i < n; i++) {
      const u0 = -aw + 2 * aw * i / n, u1 = -aw + 2 * aw * (i + 1) / n;
      const y0 = ys + Math.sqrt(Math.max(0, aw * aw - u0 * u0)), y1 = ys + Math.sqrt(Math.max(0, aw * aw - u1 * u1));
      const tp = (v) => v * 0.5;
      for (const w of [hw, -hw]) {
        const q = [M4.pt(m, u0, y0, w), M4.pt(m, u1, y1, w), M4.pt(m, u1, top, w), M4.pt(m, u0, top, w)];
        if (w > 0) DK.quad(q[0], q[1], q[2], q[3], 0xffffff, true, [[u0 * .5, y0 * .5], [u1 * .5, y1 * .5], [u1 * .5, top * .5], [u0 * .5, top * .5]]);
        else DK.quad(q[1], q[0], q[3], q[2], 0xffffff, true, [[u1 * .5, y1 * .5], [u0 * .5, y0 * .5], [u0 * .5, top * .5], [u1 * .5, top * .5]]);
      }
      // soffit (underside of the arch) + top
      S.quad(M4.pt(m, u0, y0, -hw), M4.pt(m, u1, y1, -hw), M4.pt(m, u1, y1, hw), M4.pt(m, u0, y0, hw), COL.white, true);
      S.quad(M4.pt(m, u0, top, hw), M4.pt(m, u1, top, hw), M4.pt(m, u1, top, -hw), M4.pt(m, u0, top, -hw), 0x4a483d, true);
    }
    // arch trim bands (both faces)
    const seg = 14, bw = 0.34;
    for (let i = 0; i < seg; i++) {
      const a0 = Math.PI * i / seg, a1 = Math.PI * (i + 1) / seg;
      for (const w of [hw + 0.04, -hw - 0.04]) {
        const q = [M4.pt(m, Math.cos(a0) * aw, ys + Math.sin(a0) * aw, w), M4.pt(m, Math.cos(a1) * aw, ys + Math.sin(a1) * aw, w),
          M4.pt(m, Math.cos(a1) * (aw + bw), ys + Math.sin(a1) * (aw + bw), w), M4.pt(m, Math.cos(a0) * (aw + bw), ys + Math.sin(a0) * (aw + bw), w)];
        if (w > 0) S.quad(q[0], q[1], q[2], q[3], COL.white, true); else S.quad(q[1], q[0], q[3], q[2], COL.white, true);
      }
    }
    for (const sgn of [-1, 1]) for (const w of [hw + 0.04, -hw - 0.04]) {
      const u0 = sgn * aw, u1 = sgn * (aw + bw);
      const q = [M4.pt(m, u0, 0, w), M4.pt(m, u1, 0, w), M4.pt(m, u1, ys, w), M4.pt(m, u0, ys, w)];
      if ((w > 0) === (sgn > 0)) S.quad(q[0], q[1], q[2], q[3], COL.white, true); else S.quad(q[1], q[0], q[3], q[2], COL.white, true);
    }
  }
  const ringVerts = [];
  for (let k = 0; k < 8; k++) {
    const phi = k * Math.PI / 4; const cx = C + Math.cos(phi) * RING_A, cy = C + Math.sin(phi) * RING_A;
    const m = M4.mul(edgeXf(cx, cy, phi), M4.trans(0, STEP_H[0], 0));
    archPanel(m);
  }
  // vertex pillars, white caps and red banners
  for (let k = 0; k < 8; k++) {
    const phi = (k + 0.5) * Math.PI / 4; const rv = RING_A / Math.cos(Math.PI / 8);
    const vx = C + Math.cos(phi) * rv, vy = C + Math.sin(phi) * rv;
    DK.prism(null, vx, -vy, 0, top + 0.5, 0.78, 0.78, 10, 0xffffff, 0.5, k);
    S.prism(null, vx, -vy, top + 0.5, top + 0.72, 0.9, 0.9, 10, COL.white, 0, k);
    S.prism(null, vx, -vy, 0, 0.28, 0.9, 0.9, 10, COL.white, 0, k);
    ringVerts.push([vx, vy, phi]);
    if (k % 2 === 0) { // banners hang on the outside
      const ox = Math.cos(phi) * 0.82, oy = Math.sin(phi) * 0.82;
      const m = M4.mul(edgeXf(vx + ox, vy + oy, phi), M4.trans(0, 0, 0));
      S.quad(M4.pt(m, -0.33, 1.2, 0), M4.pt(m, 0.33, 1.2, 0), M4.pt(m, 0.33, 3.5, 0), M4.pt(m, -0.33, 3.5, 0), COL.red, true);
      S.quad(M4.pt(m, 0.33, 1.2, 0), M4.pt(m, -0.33, 1.2, 0), M4.pt(m, -0.33, 3.5, 0), M4.pt(m, 0.33, 3.5, 0), COL.red, true);
      S.quad(M4.pt(m, -0.14, 2.2, 0.01), M4.pt(m, 0.14, 2.2, 0.01), M4.pt(m, 0.14, 2.6, 0.01), M4.pt(m, -0.14, 2.6, 0.01), 0xd8c8a0, false);
    }
  }
  /* central tower + clerks' counter */
  DK.prism(null, C, -C, 0, 4.4, 1.7, 1.7, 14, 0xffffff, 0.5);
  S.prism(null, C, -C, 4.4, 4.55, 1.85, 1.85, 14, 0x2d2b24, 0);
  // counter: outer wall + top ring + inner wall
  const cr = 3.9, ci = 3.35, chh = 0.95, cn = 12;
  BG.prism(null, C, -C, 0, chh, cr, cr, cn, 0xffffff, 0.5, Math.PI / 12);
  for (let i = 0; i < cn; i++) {
    const a0 = i / cn * TAU + Math.PI / 12, a1 = (i + 1) / cn * TAU + Math.PI / 12;
    const q = [[C + Math.cos(a0) * cr, chh, -(C + Math.sin(a0) * cr)], [C + Math.cos(a1) * cr, chh, -(C + Math.sin(a1) * cr)],
      [C + Math.cos(a1) * ci, chh, -(C + Math.sin(a1) * ci)], [C + Math.cos(a0) * ci, chh, -(C + Math.sin(a0) * ci)]];
    S.quad(q[0], q[1], q[2], q[3], 0xc4b58c, true);
    S.quad([q[3][0], 0, q[3][2]], [q[2][0], 0, q[2][2]], q[2], q[3], 0x6f6448, true);
  }

  /* ---------- Varrock city walls ---------- */
  function wallSeg(x0, y0, x1, y1, thick) { // axis-aligned wall of tiles
    const horiz = Math.abs(x1 - x0) > Math.abs(y1 - y0);
    const len = horiz ? Math.abs(x1 - x0) : Math.abs(y1 - y0);
    for (let s = 0; s < len; s++) {
      const x = horiz ? Math.min(x0, x1) + s : x0, y = horiz ? y0 : Math.min(y0, y1) + s;
      const hx = horiz ? 1 : thick, hy = horiz ? thick : 1;
      const gc = groundH(x + hx / 2, y + hy / 2);
      const base = groundH(x + hx / 2, y + hy / 2) - 0.6, hh = 3.9 + 0.6;
      const cxx = x + hx / 2, cyy = y + hy / 2;
      ST.box(null, cxx, base + hh / 2 + 0.0, -cyy, hx / 2, hh / 2, hy / 2, 0xffffff, 0.5);
      // crenellations on alternate tiles
      if ((s & 1) === 0) {
        ST.box(null, cxx, base + hh + 0.22, -cyy, horiz ? 0.5 : hx / 2, 0.22, horiz ? hy / 2 : 0.5, 0xffffff, 0.5);
      }
      // parapet walkway inner ledge
      for (let ax = 0; ax < hx; ax++) for (let ay = 0; ay < hy; ay++) {
        const bx = Math.floor(x) + ax, by = Math.floor(y) + ay;
        if (inMap(bx, by)) WORLD.block[by * N + bx] = 1;
      }
    }
  }
  wallSeg(10, 78, 90, 78, 1);    // north
  wallSeg(10, 26, 10, 79, 1);    // west
  wallSeg(85, 20, 85, 79, 1);    // east
  // corner towers
  for (const [tx, ty] of [[9, 77], [88, 77], [9, 24], [84, 18]]) {
    const gc = groundH(tx + 1, ty + 1);
    ST.box(null, tx + 1.5, gc + 2.6, -(ty + 1.5), 1.5, 3.2, 1.5, 0xffffff, 0.5);
    for (let ax = 0; ax < 3; ax++) for (let ay = 0; ay < 3; ay++) { const bx = tx + ax, by = ty + ay; if (inMap(bx, by)) WORLD.block[by * N + bx] = 1; }
  }

  /* ---------- Varrock buildings (beige walls, tiled roofs) ---------- */
  function building(x0, y0, w, d, h, roof) {
    const g = groundH(x0 + w / 2, y0 + d / 2);
    BG.box(null, x0 + w / 2, g + h / 2 - 0.4, -(y0 + d / 2), w / 2, h / 2 + 0.4, d / 2, 0xffffff, 0.35);
    // timber frame accents
    for (let i = 1; i < 4; i++) { const px = x0 + w * i / 4; WD.box(null, px, g + h / 2, -(y0 - 0.02), 0.09, h / 2, 0.05, 0xffffff, 1); WD.box(null, px, g + h / 2, -(y0 + d + 0.02), 0.09, h / 2, 0.05, 0xffffff, 1); }
    S.box(null, x0 + w / 2, g + h + 0.05, -(y0 + d / 2), w / 2 + 0.5, 0.1, d / 2 + 0.5, roof);
    // pitched roof
    const rh = 1.4, cy = -(y0 + d / 2);
    S.quad([x0 - 0.5, g + h + 0.1, -(y0 - 0.5)], [x0 + w + 0.5, g + h + 0.1, -(y0 - 0.5)], [x0 + w + 0.5, g + h + 0.1 + rh, cy], [x0 - 0.5, g + h + 0.1 + rh, cy], shadeCol(roof, 1.05), true);
    S.quad([x0 + w + 0.5, g + h + 0.1, -(y0 + d + 0.5)], [x0 - 0.5, g + h + 0.1, -(y0 + d + 0.5)], [x0 - 0.5, g + h + 0.1 + rh, cy], [x0 + w + 0.5, g + h + 0.1 + rh, cy], shadeCol(roof, 0.8), true);
    S.tri([x0 - 0.5, g + h + 0.1, -(y0 - 0.5)], [x0 - 0.5, g + h + 0.1 + rh, cy], [x0 - 0.5, g + h + 0.1, -(y0 + d + 0.5)], 0xa89870, true);
    S.tri([x0 + w + 0.5, g + h + 0.1, -(y0 + d + 0.5)], [x0 + w + 0.5, g + h + 0.1 + rh, cy], [x0 + w + 0.5, g + h + 0.1, -(y0 - 0.5)], 0xa89870, true);
    // door + windows on the south face
    WD.box(null, x0 + w / 2, g + 0.9, -(y0 - 0.03), 0.45, 0.9, 0.04, 0xffffff, 1);
    for (const wx of [0.22, 0.78]) S.box(null, x0 + w * wx, g + h * 0.62, -(y0 - 0.03), 0.3, 0.3, 0.03, 0x7a98b0);
    for (let ax = 0; ax < w; ax++) for (let ay = 0; ay < d; ay++) { const bx = x0 + ax, by = y0 + ay; if (inMap(bx, by)) WORLD.block[by * N + bx] = 1; }
  }
  building(68, 62, 9, 8, 4.2, 0x8a3a24);
  building(72, 46, 7, 7, 3.6, 0x6a3a2a);
  building(16, 56, 7, 9, 4.0, 0x7a4a2c);
  building(18, 36, 8, 7, 3.6, 0x8a3a24);

  /* ---------- trees ---------- */
  const tr = mulberry32(31337);
  const treeAt = (x, y, sc) => {

/* ---------------- context menu ---------------- */
function itemMenu(a, i) {
  const s = a.inv[i]; if (!s) return [CANCEL()]; const it = ITEMS[s.id]; const nm = col(NAMECOL.item, itemName(s)); const out = [];
  if (it.food) out.push(ent('Eat ' + nm, () => eatFood(G.player, i)));
  else if (it.pot) out.push(ent('Drink ' + nm, () => drinkPotion(G.player, i)));
  else if (it.slot) out.push(ent('Wield ' + nm, () => equipFromInv(G.player, i)));
  out.push(ent('Use ' + nm, () => gameMsg('Nothing interesting happens.')));
  out.push(ent('Drop ' + nm, () => { const pl = G.player; if (!pl.inv[i]) return; G.ground.push({ id: s.id, n: s.n, x: pl.x, y: pl.y, t: G.tick }); pl.inv[i] = null; }));
  out.push(ent('Examine ' + nm, () => gameMsg(it.ex)));
  out.push(CANCEL()); return out;
}
function invDefault(i) { const e = itemMenu(G.player, i)[0]; if (e) e.fn(); }
function contextMenuFor(mx, my) {
  const pl = G.player; const out = [];
  if (!inRect(mx, my, { x: VX, y: VY, w: VW, h: VH })) return out;
  const vx = mx - VX, vy = my - VY; const cam = INP.cam;
  const a = pickActor(vx, vy); const obj = a ? null : pickObject(vx, vy, cam); const tile = pickTile(cam, vx, vy);
  if (G.spellSel) {
    const sp = SPELL_BY_ID[G.spellSel];
    if (a && !a.npc && a !== pl) out.push(ent('Cast ' + col('80d0ff', sp.name) + ' -> ' + playerTag(a), () => castOn(a), { red: true }));
  } else if (a) {
    if (a.npc) {
      out.push(ent('Talk-to ' + col(NAMECOL.npc, a.name), () => cmdJob(a.x, a.y, p => dist2(p.x, p.y, a.x, a.y) <= 2 || Math.hypot(p.x - a.x, p.y - a.y) < 4.9, () => talkClerk(a)), { red: true }));
      out.push(ent('Exchange ' + col(NAMECOL.npc, a.name), () => cmdJob(a.x, a.y, p => Math.hypot(p.x - a.x, p.y - a.y) < 4.9, () => talkClerk(a)), { red: true }));
      out.push(ent('Examine ' + col(NAMECOL.npc, a.name), () => examineActor(a)));
    } else if (a !== pl) {
      out.push(ent('Attack ' + playerTag(a), () => cmdAttack(a), { red: true }));
      out.push(ent('Follow ' + col('ffffff', a.name), () => cmdFollow(a), { red: true }));
      out.push(ent('Examine ' + col('ffffff', a.name), () => examineActor(a)));
    }
  }
  if (obj) {
    const near = p => dist2(p.x, p.y, obj.x, obj.y) <= 1;
    if (obj.kind === 'bank') { out.push(ent('Bank ' + col(NAMECOL.obj, obj.name), () => cmdJob(obj.x, obj.y, near, () => openBank(obj)), { red: true })); out.push(ent('Examine ' + col(NAMECOL.obj, obj.name), () => gameMsg('Good for storing gear.'))); }
    else out.push(ent('Open ' + col(NAMECOL.obj, obj.name), () => cmdJob(obj.x, obj.y, near, () => gameMsg('The chest is empty.')), { red: true })), out.push(ent('Examine ' + col(NAMECOL.obj, obj.name), () => gameMsg('A wooden chest.')));

/* ---------------- panel interaction ---------------- */
function panelHit(mx, my, right) {

  switch (t) {
    case 'inv': {

        if (!a.inv[i]) return true;
        if (right) { openMenu(itemMenu(a, i), mx, my); return true; }
        if (G.spellSel) { G.spellSel = null; return true; }

      }
      return true;
    }
    case 'equip': {
      if (inRect(mx, my, EQ_BTN) && !right) { UI.bonusWin = !UI.bonusWin; return true; }
      for (const slot of SLOTS) if (inRect(mx, my, eqSlotRect(slot)) && a.eq[slot]) {
        const s = a.eq[slot]; const nm = col(NAMECOL.item, itemName(s));
        if (right) openMenu([ent('Remove ' + nm, () => unequipSlot(a, slot)), ent('Examine ' + nm, () => gameMsg(ITEMS[s.id].ex)), CANCEL()], mx, my);
        else unequipSlot(a, slot);
        return true;
      }
      return true;
    }
    case 'prayer': {
      for (let i = 0; i < PR_ORDER.length; i++) if (inRect(mx, my, PR_POS(i))) {
        const id = PR_ORDER[i]; const pr = PRAYER_BY_ID[id];
        if (right) openMenu([ent((a.prayers.has(id) ? 'Deactivate ' : 'Activate ') + col('ff9040', pr.name), () => togglePrayer(a, id)), CANCEL()], mx, my);
        else togglePrayer(a, id);
        return true;
      }
      return true;
    }
    case 'magic': {
      for (let i = 0; i < SPELLS.length; i++) if (inRect(mx, my, SP_POS(i))) {
        const sp = SPELLS[i]; const nm = col('80d0ff', sp.name);
        if (right) {
          const ents = [ent('Cast ' + nm, () => selectSpell(sp))];
          if (weaponOf(a).magic) ents.push(ent(a.autocast === sp.id ? 'Remove autocast ' + nm : 'Autocast ' + nm, () => { a.autocast = a.autocast === sp.id ? null : sp.id; if (a.autocast) gameMsg('Autocast set to ' + sp.name + '.'); }));
          ents.push(CANCEL()); openMenu(ents, mx, my);
        } else selectSpell(sp);
        return true;
      }
      return true;
    }
    case 'combat': {
      const w = weaponOf(a); const arr = STYLES[w.cat] || STYLES.unarmed;
      for (let i = 0; i < arr.length; i++) if (inRect(mx, my, CB.style(i))) { a.style = i; a.autocast = null; return true; }
      if (inRect(mx, my, CB.retal)) { a.autoRetal = !a.autoRetal; return true; }
      if (w.spec && inRect(mx, my, CB.spec)) { if (a.spec < w.spec.cost) gameMsg('You don\'t have enough power left.'); else a.specOn = !a.specOn; return true; }
      return true;
    }
    case 'options': {
      for (let i = 0; i < 4; i++) if (inRect(mx, my, OPT.bright(i))) { UI.brightness = i; applyBrightness(); return true; }
      if (inRect(mx, my, OPT.run)) { a.runOn = !a.runOn; return true; }
      if (inRect(mx, my, OPT.sound)) { UI.sound = !UI.sound; return true; }
      if (inRect(mx, my, OPT.bots)) { cycleBots(); return true; }
      if (inRect(mx, my, OPT.scale)) { UI.sharp = !UI.sharp; fitClient(); return true; }
      return true;
    }

function drawLogin(ctx) {
  if (!LOGIN_BG) buildLoginBg();
  ctx.drawImage(LOGIN_BG, 0, 0);
  // title (plain text; no logo)
  drawTextC(ctx, 'q16', 'RuneScape', W / 2, 90, 0xd8d8d0, true);
  loginStoneBox(ctx, LB.boxX, LB.boxY, LB.boxW, LB.boxH);
  const m = UI.mouse;
  if (App.loginStage === 0) {
    drawTextC(ctx, 'b12', 'Welcome to RuneScape', W / 2, 262, 0xffff00, true);
    loginBtn(ctx, LBTN.newUser.x, LBTN.newUser.y, LBTN.newUser.w, LBTN.newUser.h, 'New user', inRect(m.x, m.y, LBTN.newUser));
    loginBtn(ctx, LBTN.exist.x, LBTN.exist.y, LBTN.exist.w, LBTN.exist.h, 'Existing User', inRect(m.x, m.y, LBTN.exist));
    drawTextC(ctx, 'p11', 'Grand Exchange PvP - World 301', W / 2, 372, 0xc8c8c0, true);
  } else if (App.loginStage === 1) {
    drawTextC(ctx, 'b12', 'Welcome to RuneScape', W / 2, 232, 0xffff00, true);
    drawTextC(ctx, 'p11', App.msg || 'Enter your username & password.', W / 2, 252, 0xffffff, true);
    const blink = Math.floor(performance.now() / 500) % 2 ? '|' : '';
    drawText(ctx, 'b12', 'Username: ', 246, 278, 0xffffff, true); drawText(ctx, 'b12', App.user + (App.field === 0 ? blink : ''), 320, 278, 0xffff00, true);
    drawText(ctx, 'b12', 'Password: ', 246, 298, 0xffffff, true); drawText(ctx, 'b12', '*'.repeat(App.pass.length) + (App.field === 1 ? blink : ''), 320, 298, 0xffff00, true);
    loginBtn(ctx, LBTN.login.x, LBTN.login.y + 10, LBTN.login.w, LBTN.login.h, 'Login', inRect(m.x, m.y - 10, LBTN.login));
    loginBtn(ctx, LBTN.cancel.x, LBTN.cancel.y + 10, LBTN.cancel.w, LBTN.cancel.h, 'Cancel', inRect(m.x, m.y - 10, LBTN.cancel));
  } else {
    drawTextC(ctx, 'b12', 'Connecting to server...', W / 2, 270, 0xffff00, true); drawTextC(ctx, 'p11', 'Please wait...', W / 2, 290, 0xffffff, true);
  }
  ctx.drawImage(IC.cursor, m.x, m.y);
}
function loginDown(e) {
  const p = clientPos(e); UI.mouse = p; if (App.mode !== 'login') return;
  if (App.loginStage === 0) {
    if (inRect(p.x, p.y, LBTN.exist) || inRect(p.x, p.y, LBTN.newUser)) App.loginStage = 1;
  } else if (App.loginStage === 1) {
    if (inRect(p.x, p.y - 10, LBTN.login)) doLogin();
    else if (inRect(p.x, p.y - 10, LBTN.cancel)) App.loginStage = 0;
    else if (p.y > 266 && p.y < 286) App.field = 0; else if (p.y >= 286 && p.y < 304) App.field = 1;
  }
}
function loginKey(e) {
  if (App.mode !== 'login' || App.loginStage !== 1) return; const k = e.key;
  if (k === 'Enter') { doLogin(); return; } if (k === 'Tab') { App.field ^= 1; e.preventDefault(); return; }
  const f = App.field === 0 ? 'user' : 'pass';
  if (k === 'Backspace') App[f] = App[f].slice(0, -1); else if (k.length === 1 && App[f].length < 12) { App[f] += k; e.preventDefault(); }
}
function doLogin() {
  const nm = App.user.trim() || 'Pk_Player'; App.loginStage = 2;
  setTimeout(() => { startGame(nm); }, 700);
}

/* ---------------- game start ---------------- */
function startGame(name) {
  if (!App.gameInit) { initWorldState(); App.gameInit = true; }
  const pl = G.player; pl.name = name; respawnNow(pl);
  UI.tab = 3; UI.menu = null; G.dialog = null; UI.chatInput = '';
  G.msgs.length = 0; gameMsg('Welcome to RuneScape.');
  gameMsg('You are at the Grand Exchange, Varrock - a multi-combat PvP zone.', 'game');
  gameMsg('Right-click players to attack. Ice Barrage + special attacks win fights!');
  App.mode = 'game'; G.lastTick = performance.now(); pl.protectUntil = G.tick + 25;
}
function respawnNow(a) {
  a.dead = false; a.hp = a.maxHp; a.pp = a.stats.pray; a.cur = Object.assign({}, a.stats); a.run = 100; a.spec = 100; a.frozen = 0; a.skull = 0; a.anim = null; a.prayers.clear(); a.overhead = null;
  const sp = spawnPoint(true); a.x = sp.x; a.y = sp.y; a.path.length = 0; a.target = null; a.seg.length = 0; a.splats.length = 0; applyLoadout(a, a.loadoutKind || 'main');
}
function initWorldState() {
  initLoS(); createPlayer(); createClerks(); G.player.loadoutKind = 'main'; UI.botCount = 0; setBotCount(6);
}

/* ---------------- window fitting ---------------- */
function fit() {
  const wrap = document.getElementById('wrap'); const dpr = window.devicePixelRatio || 1;
  let s = Math.min(innerWidth / W, innerHeight / H); s = Math.max(0.5, Math.min(s, 6));
  let sd = s * dpr; const r = Math.round(sd);
  if (Math.abs(sd - r) < 0.1 * dpr || UI.sharp) sd = UI.sharp && sd >= 1 ? Math.floor(sd) : (Math.abs(sd - r) < 0.1 * dpr ? r : sd);
  s = sd / dpr; App.scale = s;
  const integer = sd === Math.floor(sd) && sd >= 1;
  for (const c of [App.glCanvas, INP.canvas]) if (c) c.style.imageRendering = integer ? 'pixelated' : 'auto';
  wrap.style.transform = 'translate(' + Math.floor((innerWidth - W * s) / 2) + 'px,' + Math.floor((innerHeight - H * s) / 2) + 'px) scale(' + s + ')';
}

/* ---------------- main loop ---------------- */
function frame(t) {
  requestAnimationFrame(frame);
  const ctx = App.ctx; const dt = Math.min(0.1, (t - (App.prev || t)) / 1000); App.prev = t; G.now = t;
  if (App.mode === 'load') { drawLoading(ctx); return; }
  if (App.mode === 'login') { App.glCanvas.style.visibility = 'hidden'; drawLogin(ctx); return; }
  App.glCanvas.style.visibility = 'visible';
  // ticks
  if (t - G.lastTick > 3000) G.lastTick = t;
  while (t - G.lastTick >= TICK_MS) { G.lastTick += TICK_MS; gameTick(); }
  const frac = (t - G.lastTick) / TICK_MS;
  const cam = App.cam, pl = G.player;
  updateCameraKeys(dt);
  const rp = renderPos(pl, frac); const gh = groundH(rp[0], rp[1]);
  cam.tx = rp[0]; cam.ty = gh + 0.6; cam.tz = -rp[1]; cam.update();
  drawDynamic(frac, dt, cam); updateScreenInfo(cam, frac);
  const R = App.R; R.begin(cam);
  for (const g of WORLD.statics) R.drawGPU(g);
  R.drawDynamic(DYN);
  R.setDepthWrite(false); R.drawDynamic(BLD); R.setDepthWrite(true);
  updateHover();
  drawUI(ctx, cam);
}

async function boot() {
  const ui = document.getElementById('ui'), glc = document.getElementById('gl');
  App.ctx = ui.getContext('2d'); App.ctx.imageSmoothingEnabled = false; App.glCanvas = glc; INP.canvas = ui; INP.glCanvas = glc;
  fit(); addEventListener('resize', fit); window.fitClient = fit;
  await initFonts(); requestAnimationFrame(frame);
  const steps = [
    ['Loading textures', () => { App.R = new Renderer(glc); App.R.fogCol = [0.02, 0.02, 0.02]; App.R.fogRange = [34, 62]; }],
    ['Constructing the Grand Exchange', () => buildWorld(App.R)],
    ['Preparing interface', () => { buildAllIcons(); buildFrame(); }],
    ['Loading items', () => { for (const id in ITEMS) itemIcon(id); }],
    ['Preparing camera', () => { App.cam = new Camera(); App.cam.yaw = 0; App.cam.pitch = 0.95; App.cam.dist = 17; INP.cam = App.cam; }]
  ];
  for (let i = 0; i < steps.length; i++) { App.status = steps[i][0] + '.'; App.progress = i / steps.length; await tick(); await tick(); steps[i][1](); }
  App.progress = 1; App.status = 'Loaded'; await tick();
  ui.addEventListener('mousedown', onDown); addEventListener('mouseup', onUp); addEventListener('mousemove', onMove);
  ui.addEventListener('wheel', onWheel, { passive: false }); ui.addEventListener('contextmenu', e => e.preventDefault());
  addEventListener('keydown', onKeyDown); addEventListener('keyup', onKeyUp);
  ui.style.cursor = 'none';
  const q = new URLSearchParams(location.search);
  setTimeout(() => { App.mode = 'login'; if (q.get('auto')) { App.loginStage = 1; startGame(App.user); } }, 350);
}
boot().catch(err => { console.error(err); document.body.insertAdjacentHTML('beforeend', '<pre style="position:fixed;left:0;top:0;color:#f88;background:#200;padding:8px;z-index:9">' + (err && err.stack || err) + '</pre>'); });

</script></body></html>
