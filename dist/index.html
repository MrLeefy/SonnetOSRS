  ray(px, py) {
    const nx = (px / VW) * 2 - 1, ny = 1 - (py / VH) * 2;
    const d = [this.fwd[0] + this.right[0] * nx * this.tanX + this.up[0] * ny * this.tanY,
      this.fwd[1] + this.right[1] * nx * this.tanX + this.up[1] * ny * this.tanY,
      this.fwd[2] + this.right[2] * nx * this.tanX + this.up[2] * ny * this.tanY];
    const l = Math.hypot(...d); return { o: this.eye, d: [d[0] / l, d[1] / l, d[2] / l] };
  }
}

/* short stack count string colours like RS */
function stackText(n) {
  if (n >= 10000000) return { t: Math.floor(n / 1000000) + 'M', c: 0x00ff80 };
  if (n >= 100000) return { t: Math.floor(n / 1000) + 'K', c: 0xffffff };
  return { t: String(n), c: 0xffff00 };
}

/* ---- world.js ---- */
'use strict';
/* ==========================================================================
   world.js  -  procedural Grand Exchange (Varrock) map, collision, textures
   Tile coords (x east, y north). 3D: X = x, Z = -y, Y = height.
   ========================================================================== */
const MAPN = 96, GEC = 48;
const WORLD = {
  N: MAPN,
  block: new Uint8Array(MAPN * MAPN),   // 1 = blocked
  layer: new Int8Array(MAPN * MAPN).fill(-1),
  th: new Float32Array(MAPN * MAPN),    // tile-centre height
  mm: new Int32Array(MAPN * MAPN),      // minimap colour
  objs: [], trees: [], statics: [], occluders: [], ready: false
};
const PLAT_R = 15.5;                    // platform apothem
const STEP_H = [0, -0.11, -0.22, -0.33];
const RING_A = 8.5, RING_HL = RING_A * Math.tan(Math.PI / 8), WALL_H = 3.6;
const COL = {
  dirt: 0x867b5c, grass: 0x666f33, grass2: 0x7b8a3a, flag: 0x7f7f76, dark: 0x3d3b32, white: 0xdcd5bd, light: 0x8b8b82,
  wood: 0x6b4f2a, trunk: 0x5c4526, leaf: 0x4a6e24, red: 0x8a1c14, beige: 0xa8996f
};

function poly12(dx, dy) { let m = 0; for (let k = 0; k < 6; k++) { const a = k * Math.PI / 6; m = Math.max(m, Math.abs(dx * Math.cos(a) + dy * Math.sin(a))); } return m; }
function poly8(dx, dy) { let m = 0; for (let k = 0; k < 4; k++) { const a = k * Math.PI / 4; m = Math.max(m, Math.abs(dx * Math.cos(a) + dy * Math.sin(a))); } return m; }
function inMap(x, y) { return x >= 0 && y >= 0 && x < MAPN && y < MAPN; }
function isBlocked(x, y) { return !inMap(x, y) || WORLD.block[y * MAPN + x] === 1; }
function tileH(x, y) { x = clamp(x, 0, MAPN - 1); y = clamp(y, 0, MAPN - 1); return WORLD.th[y * MAPN + x]; }
/* bilinear ground height at float tile coords (tile centre at +0.5) */
function groundH(x, y) {
  const fx = x - 0.5, fy = y - 0.5; const ix = Math.floor(fx), iy = Math.floor(fy); const tx = fx - ix, ty = fy - iy;
  const a = tileH(ix, iy), b = tileH(ix + 1, iy), c = tileH(ix, iy + 1), d = tileH(ix + 1, iy + 1);
  return lerp(lerp(a, b, tx), lerp(c, d, tx), ty);
}

/* ---------- textures (64x64, drawn with the pixel toolkit) ---------- */
function makeWorldTextures(R) {
  const mk = (name, fn) => { const p = new Pix(64, 64); fn(p); R.makeTexture(name, p.canvas(), true); };
  mk('flag', p => {
    const r = mulberry32(7); noiseFill(p, 0, 0, 64, 64, COL.flag, 5, 11);
    for (let i = 0; i < 26; i++) { // craters
      const x=3+Math.floor(r()*58),y=3+Math.floor(r()*58),rx=1+Math.floor(r()*3),ry=1+Math.floor(r()*2);
      p.ellipse(x, y, rx, ry, 0x6c6c64); p.ellipse(x - 1, y - 1, Math.max(0, rx - 1), Math.max(0, ry - 1), 0x76766d);
    }
    for (let i = 0; i < 64; i++) { p.set(i, 0, 0x5b5b53); p.set(0, i, 0x5b5b53); p.set(i, 1, 0x8c8c83); p.set(1, i, 0x8c8c83); }
  });
  mk('dark', p => { // GE ring walls: dark ashlar blocks
    noiseFill(p, 0, 0, 64, 64, COL.dark, 7, 5);
    for (let row = 0; row < 8; row++) {
      const y = row * 8, off = (row & 1) ? 8 : 0;
      p.rect(0, y, 64, 1, 0x57554a);
      for (let x = off; x < 64 + 16; x += 16) p.rect(x % 64, y, 1, 8, 0x57554a);
      p.rect(0, y + 7, 64, 1, 0x26241e);
    }
  });
  mk('stone', p => { // Varrock city wall: light grey blocks
    noiseFill(p, 0, 0, 64, 64, COL.light, 9, 3);
    for (let row = 0; row < 4; row++) {
      const y = row * 16, off = (row & 1) ? 16 : 0;
      p.rect(0, y, 64, 1, 0x6a6a62); p.rect(0, y + 1, 64, 1, 0x9c9c93);
      for (let x = off; x < 64 + 32; x += 32) { p.rect(x % 64, y, 1, 16, 0x6a6a62); }
    }
  });
  mk('wood', p => { noiseFill(p, 0, 0, 64, 64, COL.wood, 10, 9); for (let y = 0; y < 64; y += 8) p.rect(0, y, 64, 1, 0x4d3620); });
  mk('beige', p => {
    noiseFill(p, 0, 0, 64, 64, COL.beige, 6, 13);
    for (let y = 0; y < 64; y += 16) p.rect(0, y, 64, 1, 0x877a55);
    for (let x = 0; x < 64; x += 32) p.rect(x, 0, 1, 64, 0x877a55);
  });
}

/* ---------- world generation ---------- */
function buildWorld(R) {
  const N = MAPN, C = GEC; const rng = mulberry32(20070);
  makeWorldTextures(R);
  // value noise
  const NL = 32, lat = new Float32Array(NL * NL); for (let i = 0; i < lat.length; i++) lat[i] = rng();
  const sm = t => t * t * (3 - 2 * t);
  const vn = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = sm(x - xi), fy = sm(y - yi); const g = (a, b) => lat[((b & 31) * NL) + (a & 31)];
    return lerp(lerp(g(xi, yi), g(xi + 1, yi), fx), lerp(g(xi, yi + 1), g(xi + 1, yi + 1), fx), fy);
  };
  const baseGround = (x, y) => {
    const d = poly12(x - C, y - C); let h = -0.45; const t = clamp((d - 24) / 20, 0, 1.6);
    h += t * t * 6.5 * (0.35 + vn(x * 0.11, y * 0.11)) + t * 1.3 * vn(x * 0.35 + 9, y * 0.35);
    h += (vn(x * 0.5, y * 0.5) - 0.5) * 0.05;
    return h;
  };
  const M3 = (x, y, h) => [x, h, -y];

  /* platform layers + heights */
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    const d = poly12(tx + 0.5 - C, ty + 0.5 - C); let L = -1;
    if (d <= PLAT_R) L = 0; else if (d <= PLAT_R + 1) L = 1; else if (d <= PLAT_R + 2) L = 2; else if (d <= PLAT_R + 3) L = 3;
    WORLD.layer[ty * N + tx] = L;
    WORLD.th[ty * N + tx] = L >= 0 ? STEP_H[L] : baseGround(tx + 0.5, ty + 0.5);
  }

  let S = new Mesh('white'), DK = new Mesh('dark');
  const FL = new Mesh('flag'), ST = new Mesh('stone'), WD = new Mesh('wood'), BG = new Mesh('beige');
  const meshes = [S, FL, DK, ST, WD, BG];

  // Keep tall foreground structures in small separate batches so only the
  // structures hiding the player fade. Do not remove or change collision.
  WORLD.occluders=[];
  function occluder(meta,draw){
    const oldS=S,oldDK=DK;S=new Mesh('white');DK=new Mesh('dark');draw();
    meta.gpus=[DK,S].filter(m=>m.count).map(m=>R.upload(m));WORLD.occluders.push(meta);S=oldS;DK=oldDK;
  }
  /* terrain mesh (skips platform tiles) */
  const cornerH = (i, j) => baseGround(i, j);
  const cornerCol = (i, j) => {
    const d = poly12(i - C, j - C), n = vn(i * 0.3, j * 0.3), n2 = vn(i * 0.9 + 3, j * 0.9);
    const dirt = clamp((25.5 + 3.5 * n - d) / 3.5, 0, 1);
    let g = mixCol(COL.grass, COL.grass2, clamp(n * 1.2 - 0.2 + (d > 40 ? 0.15 : 0), 0, 1));
    let c = mixCol(g, COL.dirt, dirt);
    return shadeCol(c, 0.9 + 0.2 * n2);
  };
  const cN = (i, j) => { // corner normal light
    const e = 0.5; const hx = baseGround(i + e, j) - baseGround(i - e, j), hy = baseGround(i, j + e) - baseGround(i, j - e);
    return lightAt(-hx, 1, hy);
  };
  const litCol = (i, j) => { const c = cornerCol(i, j), f = cN(i, j); return shadeCol(c, f); };
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    if (WORLD.layer[ty * N + tx] >= 0) continue;
    const c = [litCol(tx, ty), litCol(tx + 1, ty), litCol(tx + 1, ty + 1), litCol(tx, ty + 1)];
    S.quad(M3(tx, ty, cornerH(tx, ty)), M3(tx + 1, ty, cornerH(tx + 1, ty)), M3(tx + 1, ty + 1, cornerH(tx + 1, ty + 1)), M3(tx, ty + 1, cornerH(tx, ty + 1)), c, false);
  }
  // ground under the platform (avoids seeing the void through risers)
  S.quad(M3(C - 24, C - 24, -0.5), M3(C + 24, C - 24, -0.5), M3(C + 24, C + 24, -0.5), M3(C - 24, C + 24, -0.5), 0x6b6a58, false);

  /* platform tops + risers */
  const rr = mulberry32(99);
  for (let ty = 0; ty < N; ty++) for (let tx = 0; tx < N; tx++) {
    const L = WORLD.layer[ty * N + tx]; if (L < 0) continue; const h = STEP_H[L];
    const v = 0.94 + rr() * 0.1; const cc = shadeCol(0xffffff, v);
    FL.quad(M3(tx, ty, h), M3(tx + 1, ty, h), M3(tx + 1, ty + 1, h), M3(tx, ty + 1, h), cc, true, [[0, 1], [1, 1], [1, 0], [0, 0]]);
    const nb = [[0, -1, 'S'], [1, 0, 'E'], [0, 1, 'N'], [-1, 0, 'W']];
    for (const [ox, oy] of nb) {
      const nx = tx + ox, ny = ty + oy; const nL = inMap(nx, ny) ? WORLD.layer[ny * N + nx] : -1;
      const nh = nL >= 0 ? STEP_H[nL] : -0.5;
      if (nh < h - 0.001) {
        let a, b;
        if (oy === -1) { a = M3(tx, ty, h); b = M3(tx + 1, ty, h); } else if (ox === 1) { a = M3(tx + 1, ty, h); b = M3(tx + 1, ty + 1, h); }
        else if (oy === 1) { a = M3(tx + 1, ty + 1, h); b = M3(tx, ty + 1, h); } else { a = M3(tx, ty + 1, h); b = M3(tx, ty, h); }
        FL.quad([a[0], nh, a[2]], [b[0], nh, b[2]], b, a, 0xd0d0c8, true, [[0, 0.5], [1, 0.5], [1, 0.4], [0, 0.4]]);
      }
    }
  }

  /* ---------- ring of 8 arched walls around the tower ---------- */
  const hl = RING_HL, aw = 1.6, ys = 1.5, th = 0.72, top = WALL_H;
  const edgeXf = (cx, cy, phi) => {
    const s = Math.sin(phi), c = Math.cos(phi);
    return [-s, 0, -c, 0, 0, 1, 0, 0, c, 0, -s, 0, cx, 0, -cy, 1];
  };
  const P = (u, v, w) => [u, v, w];
  function archPanel(m) {
    const hw = th / 2;
    // stubs
    DK.box(m, -(hl + aw) / 2, top / 2, 0, (hl - aw) / 2, top / 2, hw, 0xffffff, 0.5);
    DK.box(m, (hl + aw) / 2, top / 2, 0, (hl - aw) / 2, top / 2, hw, 0xffffff, 0.5);
    // lintel slices
    const n = 12;
    for (let i = 0; i < n; i++) {
      const u0 = -aw + 2 * aw * i / n, u1 = -aw + 2 * aw * (i + 1) / n;
      const y0 = ys + Math.sqrt(Math.max(0, aw * aw - u0 * u0)), y1 = ys + Math.sqrt(Math.max(0, aw * aw - u1 * u1));
      const tp = (v) => v * 0.5;
      for (const w of [hw, -hw]) {
        const q = [M4.pt(m, u0, y0, w), M4.pt(m, u1, y1, w), M4.pt(m, u1, top, w), M4.pt(m, u0, top, w)];
        if (w > 0) DK.quad(q[0], q[1], q[2], q[3], 0xffffff, true, [[u0 * .5, y0 * .5], [u1 * .5, y1 * .5], [u1 * .5, top * .5], [u0 * .5, top * .5]]);
        else DK.quad(q[1], q[0], q[3], q[2], 0xffffff, true, [[u1 * .5, y1 * .5], [u0 * .5, y0 * .5], [u0 * .5, top * .5], [u1 * .5, top * .5]]);
      }
      // soffit (underside of the arch) + top
      S.quad(M4.pt(m, u0, y0, -hw), M4.pt(m, u1, y1, -hw), M4.pt(m, u1, y1, hw), M4.pt(m, u0, y0, hw), COL.white, true);
      S.quad(M4.pt(m, u0, top, hw), M4.pt(m, u1, top, hw), M4.pt(m, u1, top, -hw), M4.pt(m, u0, top, -hw), 0x4a483d, true);
    }
    // arch trim bands (both faces)
    const seg = 14, bw = 0.34;
    for (let i = 0; i < seg; i++) {
      const a0 = Math.PI * i / seg, a1 = Math.PI * (i + 1) / seg;
      for (const w of [hw + 0.04, -hw - 0.04]) {
        const q = [M4.pt(m, Math.cos(a0) * aw, ys + Math.sin(a0) * aw, w), M4.pt(m, Math.cos(a1) * aw, ys + Math.sin(a1) * aw, w),
          M4.pt(m, Math.cos(a1) * (aw + bw), ys + Math.sin(a1) * (aw + bw), w), M4.pt(m, Math.cos(a0) * (aw + bw), ys + Math.sin(a0) * (aw + bw), w)];
        if (w > 0) S.quad(q[0], q[1], q[2], q[3], COL.white, true); else S.quad(q[1], q[0], q[3], q[2], COL.white, true);
      }
    }
    for (const sgn of [-1, 1]) for (const w of [hw + 0.04, -hw - 0.04]) {
      const u0 = sgn * aw, u1 = sgn * (aw + bw);
      const q = [M4.pt(m, u0, 0, w), M4.pt(m, u1, 0, w), M4.pt(m, u1, ys, w), M4.pt(m, u0, ys, w)];
      if ((w > 0) === (sgn > 0)) S.quad(q[0], q[1], q[2], q[3], COL.white, true); else S.quad(q[1], q[0], q[3], q[2], COL.white, true);
    }
  }
  const ringVerts = [];
  for (let k = 0; k < 8; k++) {
    const phi = k * Math.PI / 4; const cx = C + Math.cos(phi) * RING_A, cy = C + Math.sin(phi) * RING_A;
    const m = M4.mul(edgeXf(cx, cy, phi), M4.trans(0, STEP_H[0], 0));
    occluder({kind:"arch",x:cx,y:cy,phi,half:hl,thick:th/2+.06,height:WALL_H,aperture:aw,spring:ys},()=>archPanel(m));
  }
  // vertex pillars, white caps and red banners
  for (let k = 0; k < 8; k++) {
    const phi = (k + 0.5) * Math.PI / 4; const rv = RING_A / Math.cos(Math.PI / 8);
    const vx = C + Math.cos(phi) * rv, vy = C + Math.sin(phi) * rv;
    occluder({kind:'pillar',x:vx,y:vy,radius:.92,height:top+.72},()=>{
    DK.prism(null, vx, -vy, 0, top + 0.5, 0.78, 0.78, 10, 0xffffff, 0.5, k);
    S.prism(null, vx, -vy, top + 0.5, top + 0.72, 0.9, 0.9, 10, COL.white, 0, k);
    S.prism(null, vx, -vy, 0, 0.28, 0.9, 0.9, 10, COL.white, 0, k);
    ringVerts.push([vx, vy, phi]);
    if (k % 2 === 0) { // banners hang on the outside
      const ox = Math.cos(phi) * 0.82, oy = Math.sin(phi) * 0.82;
      const m = M4.mul(edgeXf(vx + ox, vy + oy, phi), M4.trans(0, 0, 0));
      S.quad(M4.pt(m, -0.33, 1.2, 0), M4.pt(m, 0.33, 1.2, 0), M4.pt(m, 0.33, 3.5, 0), M4.pt(m, -0.33, 3.5, 0), COL.red, true);
      S.quad(M4.pt(m, 0.33, 1.2, 0), M4.pt(m, -0.33, 1.2, 0), M4.pt(m, -0.33, 3.5, 0), M4.pt(m, 0.33, 3.5, 0), COL.red, true);
      S.quad(M4.pt(m, -0.14, 2.2, 0.01), M4.pt(m, 0.14, 2.2, 0.01), M4.pt(m, 0.14, 2.6, 0.01), M4.pt(m, -0.14, 2.6, 0.01), 0xd8c8a0, false);
    }
    });
  }
  /* central tower + clerks' counter */
  occluder({kind:'pillar',x:C,y:C,radius:1.95,height:5.0},()=>{
  DK.prism(null, C, -C, 0, 4.4, 1.7, 1.7, 14, 0xffffff, 0.5);
  S.prism(null, C, -C, 4.4, 4.55, 1.85, 1.85, 14, 0x2d2b24, 0);
  S.prism(null,C,-C,4.25,4.37,1.82,1.82,14,0xaaa18b,0);
  for(let k=0;k<14;k++){
    const a=k/14*TAU,x=C+Math.cos(a)*1.62,z=-C+Math.sin(a)*1.62;
    S.box(null,x,4.72,z,.18,.18,.18,0x746f5d);
  }
  });
  // counter: outer wall + top ring + inner wall
  const cr = 3.9, ci = 3.35, chh = 0.95, cn = 12;

  for (let i = 0; i < cn; i++) {
    const a0 = i / cn * TAU + Math.PI / 12, a1 = (i + 1) / cn * TAU + Math.PI / 12;
    const q = [[C + Math.cos(a0) * cr, chh, -(C + Math.sin(a0) * cr)], [C + Math.cos(a1) * cr, chh, -(C + Math.sin(a1) * cr)],
      [C + Math.cos(a1) * ci, chh, -(C + Math.sin(a1) * ci)], [C + Math.cos(a0) * ci, chh, -(C + Math.sin(a0) * ci)]];
    BG.quad([q[0][0],0,q[0][2]],[q[1][0],0,q[1][2]],q[1],q[0],0xffffff,true,[[0,.5],[1,.5],[1,0],[0,0]]);
    S.quad(q[0], q[1], q[2], q[3], 0xc4b58c, true);
    S.quad([q[3][0], 0, q[3][2]], [q[2][0], 0, q[2][2]], q[2], q[3], 0x6f6448, true);
  }

  /* ---------- Varrock city walls ---------- */
  function wallSeg(x0, y0, x1, y1, thick) { // axis-aligned wall of tiles
    const horiz = Math.abs(x1 - x0) > Math.abs(y1 - y0);
    const len = horiz ? Math.abs(x1 - x0) : Math.abs(y1 - y0);
    for (let s = 0; s < len; s++) {
      const x = horiz ? Math.min(x0, x1) + s : x0, y = horiz ? y0 : Math.min(y0, y1) + s;
      const hx = horiz ? 1 : thick, hy = horiz ? thick : 1;
      const gc = groundH(x + hx / 2, y + hy / 2);
      const base = groundH(x + hx / 2, y + hy / 2) - 0.6, hh = 3.9 + 0.6;
      const cxx = x + hx / 2, cyy = y + hy / 2;
      ST.box(null, cxx, base + hh / 2 + 0.0, -cyy, hx / 2, hh / 2, hy / 2, 0xffffff, 0.5);
      // crenellations on alternate tiles
      if ((s & 1) === 0) {
        ST.box(null, cxx, base + hh + 0.22, -cyy, horiz ? 0.5 : hx / 2, 0.22, horiz ? hy / 2 : 0.5, 0xffffff, 0.5);
      }
      // parapet walkway inner ledge
      for (let ax = 0; ax < hx; ax++) for (let ay = 0; ay < hy; ay++) {
        const bx = Math.floor(x) + ax, by = Math.floor(y) + ay;
        if (inMap(bx, by)) WORLD.block[by * N + bx] = 1;
      }
    }
  }
  wallSeg(10, 78, 90, 78, 1);    // north
  wallSeg(10, 26, 10, 79, 1);    // west
  wallSeg(85, 20, 85, 79, 1);    // east
  // corner towers
  for (const [tx, ty] of [[9, 77], [88, 77], [9, 24], [84, 18]]) {
    const gc = groundH(tx + 1, ty + 1);
    ST.box(null, tx + 1.5, gc + 2.6, -(ty + 1.5), 1.5, 3.2, 1.5, 0xffffff, 0.5);
    for (let ax = 0; ax < 3; ax++) for (let ay = 0; ay < 3; ay++) { const bx = tx + ax, by = ty + ay; if (inMap(bx, by)) WORLD.block[by * N + bx] = 1; }
  }

  /* ---------- Varrock buildings (beige walls, tiled roofs) ---------- */
  function building(x0, y0, w, d, h, roof) {
    const g = groundH(x0 + w / 2, y0 + d / 2);
    BG.box(null, x0 + w / 2, g + h / 2 - 0.4, -(y0 + d / 2), w / 2, h / 2 + 0.4, d / 2, 0xffffff, 0.35);
    // timber frame accents
    for (let i = 1; i < 4; i++) { const px = x0 + w * i / 4; WD.box(null, px, g + h / 2, -(y0 - 0.02), 0.09, h / 2, 0.05, 0xffffff, 1); WD.box(null, px, g + h / 2, -(y0 + d + 0.02), 0.09, h / 2, 0.05, 0xffffff, 1); }
    S.box(null, x0 + w / 2, g + h + 0.05, -(y0 + d / 2), w / 2 + 0.5, 0.1, d / 2 + 0.5, roof);
    // pitched roof
    const rh = 1.4, cy = -(y0 + d / 2);
    S.quad([x0 - 0.5, g + h + 0.1, -(y0 - 0.5)], [x0 + w + 0.5, g + h + 0.1, -(y0 - 0.5)], [x0 + w + 0.5, g + h + 0.1 + rh, cy], [x0 - 0.5, g + h + 0.1 + rh, cy], shadeCol(roof, 1.05), true);

function pickTile(cam,mx,my){

function prayerGlyph(p, id) {
  const c = 13;

    case 'thick': case 'rock': case 'steel': {
      const col = id === 'thick' ? 0xb08040 : id === 'rock' ? 0xa0a098 : 0xd0d4dc;
      p.poly([[7, 6], [19, 6], [19, 14], [13, 21], [7, 14]], col); p.rect(13, 7, 1, 13, shadeCol(col, 0.7)); break;
    }
    case 'burst': case 'super': case 'ultimate': {
      const n = id === 'burst' ? 1 : id === 'super' ? 2 : 3;
      for (let i = 0; i < n; i++) p.poly([[13, 5 + i * 5], [19, 11 + i * 5 - 1], [7, 11 + i * 5 - 1]], 0xe84828);
      p.rect(11, 12 + (n - 1) * 5, 5, 4, 0xe84828); break;

    case 'clarity': case 'improved': case 'incredible': {
      p.ellipse(13, 13, 8, 4, 0xe8f0ff); p.disc(13, 13, 3, 0x2848c8); p.set(12, 12, 0xffffff);
      const n = id === 'clarity' ? 0 : id === 'improved' ? 1 : 2; for (let i = 0; i < n; i++) { p.rect(6 + i * 12, 5, 2, 3, 0xffff60); }
      break;
    }
    case 'rapidrestore': p.rect(11, 6, 4, 14, 0x40d060); p.rect(6, 11, 14, 4, 0x40d060); break;
    case 'rapidheal': p.rect(11, 6, 4, 14, 0xe83030); p.rect(6, 11, 14, 4, 0xe83030); break;

'use strict';
/* Versioned local profiles. Imports are data, never executable code.
 * Arena and Expedition use separate keys; a practice kit cannot be imported
 * into an Expedition profile through the UI. Storage failures do not stop play.

const Profiles = (() => {
  const VERSION=2, PREFIX='leefy.sonnet.v2.';
  const P={version:VERSION,name:'Leefy',mode:'arena',status:'Not saved yet',blocked:false,storage:null,lastSave:0,
    settings:{quality:'balanced',layout:'auto',sound:true,showFps:false,reduceMotion:false,cameraSmooth:true}};
  const fail = s => {throw new Error(s);};
  const object = x => x!==null && typeof x==='object' && !Array.isArray(x);
  const int = (v,min,max,label) => Number.isSafeInteger(v)&&v>=min&&v<=max?v:fail('Invalid '+label);
  const finite = (v,min,max,label) => Number.isFinite(v)&&v>=min&&v<=max?v:fail('Invalid '+label);
  const cleanName = n => String(n||'Player').replace(/[^a-zA-Z0-9 _-]/g,'').trim().slice(0,12)||'Player';
  const key=()=>PREFIX+P.mode+'.'+P.name.toLowerCase();
  function item(s,bank=false){
    if(s===null && !bank)return null;
    if(!object(s)||!Engine.validItem(s.id))fail('Unknown item');
    const it=ITEMS[s.id],n=int(s.n,1,it.stack?Engine.MAX_STACK:it.doses||1,'item quantity');
    if(bank){const qty=int(s.qty,1,Engine.MAX_STACK,'bank count');if(it.stack&&qty!==1)fail('Stack bank count must be 1');return{id:s.id,n,qty};}
    return{id:s.id,n};

  P.validate = data => {
    if(!object(data)||data.version!==VERSION)fail('Unsupported save version');
    if(!['arena','expedition'].includes(data.mode))fail('Unknown game mode');
    const name=cleanName(data.name);if(name!==data.name)fail('Invalid profile name');
    const a=data.player;if(!object(a)||!object(a.stats)||!object(a.eq))fail('Missing character data');
    if(!Array.isArray(a.inv)||a.inv.length!==28)fail('Inventory must have exactly 28 slots');
    const stats={};for(const k of ['atk','str','def','rng','mag','pray','hp'])stats[k]=int(a.stats[k],1,99,k);
    const eq={};for(const slot of SLOTS)if(a.eq[slot]){eq[slot]=item(a.eq[slot]);if(ITEMS[eq[slot].id].slot!==slot)fail('Equipment in wrong slot');}
    if(eq.weapon&&ITEMS[eq.weapon.id].two&&eq.shield)fail('Two-handed weapon conflicts with shield');
    const inv=a.inv.map(s=>item(s));
    const bank=Array.isArray(data.bank)&&data.bank.length<=120?data.bank.map(s=>item(s,true)):fail('Invalid bank');
    const xp={};for(const k of Expedition.xpKeys)xp[k]=int(data.xp&&data.xp[k]!==undefined?data.xp[k]:0,0,Expedition.xpFor(99),k+' XP');
    if(data.mode==='expedition')for(const k of Object.keys(stats))if(stats[k]!==Expedition.levelFor(xp[k]))fail('XP does not match '+k+' level');
    const progress={},claimed={};
    for(const q of Expedition.quests){
      progress[q.id]=int(data.progress&&data.progress[q.id]!==undefined?data.progress[q.id]:0,0,q.goal,'contract progress');
      claimed[q.id]=!!(data.claimed&&data.claimed[q.id]===true);
      if(claimed[q.id]&&progress[q.id]<q.goal)fail('Claimed contract is incomplete');
    }
    const metrics={};for(const k of ['kills','deaths','streak','best','dmgDealt','dmgTaken'])metrics[k]=int(data.metrics&&data.metrics[k]!==undefined?data.metrics[k]:0,0,Engine.MAX_STACK,k);
    const kit={};for(const k of ['skin','hair','shirt','pants','boots'])if(a.kit&&a.kit[k]!==undefined)kit[k]=int(a.kit[k],0,0xffffff,'appearance');
    kit.hairStyle=int(a.kit&&a.kit.hairStyle!==undefined?a.kit.hairStyle:1,0,2,'hair style');
    const player={stats,eq,inv,kit,hp:finite(a.hp,0,stats.hp+30,'hitpoints'),pp:finite(a.pp,0,stats.pray,'prayer'),
      x:int(a.x,0,MAPN-1,'x'),y:int(a.y,0,MAPN-1,'y'),run:finite(a.run,0,100,'energy'),
      spec:finite(a.spec,0,100,'special energy'),runOn:a.runOn!==false,autoRetal:a.autoRetal!==false,
      loadoutKind:Object.prototype.hasOwnProperty.call(LOADOUTS,a.loadoutKind)?a.loadoutKind:'main'};
    return{version:VERSION,name,mode:data.mode,player,bank,xp,progress,claimed,metrics,pvmKills:int(data.pvmKills||0,0,Engine.MAX_STACK,'PvM kills'),savedAt:typeof data.savedAt==='string'?data.savedAt.slice(0,40):''};
  };
  P.parse = raw => {if(typeof raw!=='string'||raw.length>150000)fail('Save is too large');return P.validate(JSON.parse(raw));};
  function store(){return P.storage||window.localStorage;}
  P.loadSettings = () => {
    try{
      const raw=store().getItem(PREFIX+'settings'),s=raw?JSON.parse(raw):{};
      if(['low','balanced','high'].includes(s.quality))P.settings.quality=s.quality;
      if(['auto','classic','touch'].includes(s.layout))P.settings.layout=s.layout;
      for(const k of ['sound','showFps','reduceMotion','cameraSmooth'])if(typeof s[k]==='boolean')P.settings[k]=s[k];
    }catch(_){P.status='Browser storage unavailable';}
  };
  P.saveSettings = () => {try{store().setItem(PREFIX+'settings',JSON.stringify(P.settings));return true;}catch(_){P.status='Settings could not be stored';return false;}};
  P.select = (name,mode) => {P.name=cleanName(name);P.mode=mode==='expedition'?'expedition':'arena';P.blocked=false;};

      player:{stats:{...a.stats},eq:a.eq,inv:a.inv,kit:a.kit,hp:a.hp,pp:a.pp,x:a.x,y:a.y,run:a.run,spec:a.spec,runOn:a.runOn,autoRetal:a.autoRetal,loadoutKind:a.loadoutKind||'main'},
      bank:Expedition.bank,xp:Expedition.xp,progress:Expedition.progress,claimed:Expedition.claimed,pvmKills:Expedition.pvmKills,metrics};
    return P.validate(data);
  };
  P.apply = data => {

    a.eq=s.eq;a.inv=s.inv;a.kit=s.kit;a.hp=s.hp>0?s.hp:a.maxHp;a.pp=s.hp>0?s.pp:s.stats.pray;
    const valid=s.hp>0&&passable(s.x,s.y);a.x=valid?s.x:48;a.y=valid?s.y:34;
    a.run=s.run;a.spec=s.spec;a.dead=false;a.prayers.clear();a.overhead=null;a.anim=null;a.frozen=0;a.skull=0;
    a.style=0;a.autocast=null;a.specOn=false;a.runOn=s.runOn;a.autoRetal=s.autoRetal;a.loadoutKind=s.loadoutKind;
    a.level=combatLevel(a.stats);a.protectUntil=G.tick+20;recalcBonus(a);
    Expedition.bank=d.bank;Expedition.xp=d.xp;Expedition.progress=d.progress;Expedition.claimed=d.claimed;Expedition.pvmKills=d.pvmKills;
    for(const k of Object.keys(d.metrics))G[k]=d.metrics[k];
    if(typeof Polish!=='undefined')Polish.snapCamera=true;
  };
  P.save = (notify=false) => {
    if(typeof Online!=='undefined'&&Online.active){
      P.status='World 1 progress is stored by the OLDSKOOL server';
      if(notify&&G.player)gameMsg(P.status+'.');
      return true;
    }

      const raw=JSON.stringify(P.capture()),s=store(),previous=s.getItem(key());

      if(notify)gameMsg('Profile saved in this browser.');return true;
    }catch(err){P.status='Save failed — export a backup to keep progress';if(notify)gameMsg(P.status);return false;}
  };

      a.href=url;a.download='SonnetOSRS-'+P.name+'-'+P.mode+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);P.status='Backup exported';

/* ---- controls.js ---- */
'use strict';
/* One gesture state machine. Cancellations never take the pointerup path. */
const Controls = (() => {
  const C={points:new Map(),mouseDown:false,timer:null,gesture:null,clickBlock:new Map()};
  clientPos=e=>{const p=Client.toGame(e.clientX,e.clientY);return{x:Math.floor(p.x),y:Math.floor(p.y)};};
  const virtual=(x,y,button=0)=>({clientX:x,clientY:y,button,preventDefault(){}});
  const domUI=e=>e.target&&e.target.closest&&e.target.closest('#client-panel,#client-bar,#client-footer,#client-context,#client-dialog');
  const playable=()=>App.mode==='game'&&!Client.panel&&!App.contextLost&&!App.manualPause&&!document.hidden;
  const clearTimer=()=>{if(C.timer!==null)clearTimeout(C.timer);C.timer=null;};
  function release(p){try{if(p.target.hasPointerCapture(p.id))p.target.releasePointerCapture(p.id);}catch(_){}}
  C.cancelAll=()=>{
    clearTimer();const points=[...C.points.values()];C.points.clear();C.gesture=null;C.mouseDown=false;
    UI.drag=null;INP.mmb=false;INP.keys={};
    for(const p of points)release(p);
    // Clear the old compatibility structure as well for tooling/extensions.
    if(INP.touch){INP.touch.points.clear();clearTouchLongPress();resetTouchGesture();}
  };
  function pair(){const p=[...C.points.values()];return p.length>=2?{dist:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}:null;}
  C.down=e=>{
    if(!playable())return;e.preventDefault();sndInit();
    const pos=clientPos(e);if(pos.x<0||pos.y<0||pos.x>=W||pos.y>=H)return;
    UI.touchMode=e.pointerType==='touch';UI.mouse=pos;
    if(e.pointerType!=='touch'){
      C.mouseDown=true;onDown(e);
      try{e.currentTarget.setPointerCapture(e.pointerId);}catch(_){}return;
    }
    const world=inRect(pos.x,pos.y,{x:VX,y:VY,w:VW,h:VH})&&!UI.menu&&!UI.bonusWin;
    const inventory=!world&&UI.tab===3&&inRect(pos.x,pos.y,PANEL)&&!UI.menu;
    const p={id:e.pointerId,x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY,lastX:e.clientX,lastY:e.clientY,
      target:e.currentTarget,kind:world?'world':inventory?'inventory':'ui',moved:false,held:false,consumed:false,dragging:false};
    C.points.set(p.id,p);try{p.target.setPointerCapture(p.id);}catch(_){}
    if(C.points.size>1){
      clearTimer();UI.drag=null;for(const point of C.points.values())point.consumed=true;
      C.gesture=[...C.points.values()].every(point=>point.kind==='world')?pair():null;return;
    }
    if(world||(!UI.menu&&inRect(pos.x,pos.y,PANEL)&&[3,4,5,6].includes(UI.tab))){
      C.timer=setTimeout(()=>{
        C.timer=null;
        if(!playable()||C.points.get(p.id)!==p||C.points.size!==1||p.moved||p.consumed)return;
        p.held=true;p.consumed=true;onDown(virtual(p.x,p.y,2));
      },480);
    }
  };
  C.move=e=>{
    if(e.pointerType!=='touch'){
      if(!playable())return;
      if(domUI(e)&&!C.mouseDown)return;
      if(INP.mmb && !(e.buttons&4))INP.mmb=false;
      UI.touchMode=false;onMove(e);return;
    }
    const p=C.points.get(e.pointerId);if(!p)return;
    if(!playable()){C.cancelAll();return;}
    e.preventDefault();p.x=e.clientX;p.y=e.clientY;UI.mouse=clientPos(e);
    if(C.points.size>=2){
      clearTimer();const now=pair();
      if(C.gesture&&now&&C.gesture.dist>0)INP.cam.dist=clamp(INP.cam.dist* C.gesture.dist/Math.max(1,now.dist),8,26);
      if(C.gesture)C.gesture=now;return;
    }
    if(p.held)return;
    const delta=Math.hypot(p.x-p.sx,p.y-p.sy);
    if(delta>7){p.moved=true;clearTimer();}
    if(p.kind==='world'&&p.moved){
      const scale=Client.mobile?Math.min(2,Math.max(.5,512/Client.world.w)):1;
      INP.cam.yaw+=(p.x-p.lastX)*.006*scale;
      INP.cam.pitch=clamp(INP.cam.pitch+(p.y-p.lastY)*.004*scale,.25,1.35);
    }else if(p.kind==='inventory'&&p.moved&&!p.consumed){
      if(!p.dragging){onDown(virtual(p.sx,p.sy));p.dragging=true;}
      onMove(virtual(p.x,p.y));
    }
    p.lastX=p.x;p.lastY=p.y;
  };
  C.up=e=>{
    if(e.pointerType!=='touch'){
      if(!C.mouseDown)return;C.mouseDown=false;
      if(!playable()){UI.drag=null;INP.mmb=false;return;}
      if(UI.drag&&!UI.drag.active){const p=clientPos(e);if(!inRect(p.x,p.y,invSlotRect(UI.drag.from))){UI.drag=null;return;}}
      onUp(e);return;
    }
    const p=C.points.get(e.pointerId);if(!p)return;
    e.preventDefault();clearTimer();
    if(playable()&&!p.consumed&&!p.held&&C.points.size===1){
      if(p.dragging)onUp(virtual(e.clientX,e.clientY));
      else if(!p.moved){onDown(virtual(e.clientX,e.clientY));onUp(virtual(e.clientX,e.clientY));}
    }
    // Chromium may retarget the synthetic click to a newly opened DOM menu.
    // Canvas actions already ran above; this compatibility click must not run
    // a second action (e.g. eat food immediately after opening its menu).
    C.clickBlock.set(p.id,performance.now()+800);
    C.points.delete(p.id);release(p);
    if(!C.points.size){C.gesture=null;UI.drag=null;}
    else{C.gesture=pair();for(const other of C.points.values()){other.consumed=true;other.lastX=other.x;other.lastY=other.y;}}
  };
  C.cancel=e=>{if(C.points.has(e.pointerId)||C.mouseDown)C.cancelAll();};
  C.bind=()=>{
    const targets=[INP.canvas,Client.surface];
    addEventListener('pointerdown',e=>C.clickBlock.delete(e.pointerId),true);
    addEventListener('click',e=>{
      const until=C.clickBlock.get(e.pointerId);
      if(until!==undefined){C.clickBlock.delete(e.pointerId);if(performance.now()<until){e.preventDefault();e.stopImmediatePropagation();}}
      for(const [id,t]of C.clickBlock)if(t<performance.now())C.clickBlock.delete(id);
    },true);
    if('PointerEvent'in window){
      for(const t of targets){t.style.touchAction='none';t.addEventListener('pointerdown',C.down,{passive:false});t.addEventListener('lostpointercapture',C.cancel);}
      addEventListener('pointermove',C.move,{passive:false});addEventListener('pointerup',C.up,{passive:false});addEventListener('pointercancel',C.cancel);
    }else{
      // Conservative legacy mouse fallback; no fake touch-event translation.
      for(const t of targets)t.addEventListener('mousedown',onDown);
      addEventListener('mousemove',onMove);addEventListener('mouseup',onUp);
    }
    for(const t of targets){t.addEventListener('contextmenu',e=>e.preventDefault());t.addEventListener('wheel',e=>{if(playable())onWheel(e);},{passive:false});}
    addEventListener('keydown',e=>{
      if(e.key==='Escape'&&Client.panel&&App.mode==='game'){e.preventDefault();Client.close();return;}
      if(domUI(e)||/^(INPUT|TEXTAREA|SELECT|BUTTON)$/.test(e.target&&e.target.tagName||''))return;
      if(!playable())return;onKeyDown(e);
    });
    addEventListener('keyup',e=>onKeyUp(e));addEventListener('blur',C.cancelAll);
    document.addEventListener('visibilitychange',()=>{if(document.hidden){C.cancelAll();Profiles.save();}});
    addEventListener('pagehide',()=>{C.cancelAll();Profiles.save();});
  };
  return C;
})();

'use strict';
/* Presentation-only changes: simulation rules stay at 600 ms.
 * Dynamic buffers grow on demand and reuse storage between frames.

const Polish = (() => {
  const P={fps:0,particles:[],serial:0,snapCamera:true,dt:1/60,drawCalls:0,vertices:0,extra:null};
  const settings=()=>Profiles.settings;

    if(settings().reduceMotion)P.particles.length=0;

  };
  P.resize=()=>{
    if(!App.glCanvas)return;
    const aspect=Client.mobile&&Client.world?Client.world.w/Client.world.h:VW/VH;
    const cap=settings().quality==='low'?512:settings().quality==='high'?1536:1024;
    const cssWidth=Client.mobile&&Client.world?Client.world.w:VW*(App.scale||1);
    const factor=settings().quality==='low'?1:Math.min(devicePixelRatio||1,settings().quality==='high'?2:1.5);
    const width=Math.round(clamp(cssWidth*factor,256,cap)),height=Math.round(width/aspect);
    if(App.glCanvas.width!==width)App.glCanvas.width=width;
    if(App.glCanvas.height!==height)App.glCanvas.height=height;
  };
  Renderer.prototype.pack=function(mesh){

    if(!mesh._packed||mesh._packed.byteLength<need){let cap=1024;while(cap<need)cap*=2;mesh._packed=new ArrayBuffer(cap);mesh._f32=new Float32Array(mesh._packed);mesh._u8=new Uint8Array(mesh._packed);}

  };

  Renderer.prototype.drawGPU=function(g){oldGPU.call(this,g);if(g.count){P.drawCalls++;P.vertices+=g.count;}};
  Renderer.prototype.begin=function(cam){
    const gl=this.gl;P.drawCalls=0;P.vertices=0;
    gl.viewport(0,0,this.canvas.width,this.canvas.height);gl.clearColor(...this.fogCol,1);gl.depthMask(true);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.useProgram(this.prog);
    if(!this.vpBuffer)this.vpBuffer=new Float32Array(16);this.vpBuffer.set(cam.vp);

    const smooth=settings().cameraSmooth&&!settings().reduceMotion;
    this._visibleDist=this._visibleDist===undefined?this.dist:lerp(this._visibleDist,this.dist,smooth?1-Math.exp(-P.dt*16):1);

    let fx=this.tx-this.eye[0],fy=this.ty-this.eye[1],fz=this.tz-this.eye[2];const l=Math.hypot(fx,fy,fz)||1;fx/=l;fy/=l;fz/=l;

/* ---- visibility.js ---- */
'use strict';
/* Fade only a tall structure that intersects the camera-to-character sightline.
 * Collision and input remain unchanged. GPU opacity is reset after every pass.
 */
const WorldVisibility=(()=>{
  const V={faded:[],solid:[],fadedCount:0};
  function intersects(o,from,to){
    let lo=0,hi=1;
    const phi=o.phi||0,c=Math.cos(phi),s=Math.sin(phi);
    const point=a=>o.kind==='arch'?[-(a[0]-o.x)*s+(a[2]-o.y)*c,a[1],(a[0]-o.x)*c+(a[2]-o.y)*s]:[a[0]-o.x,a[1],a[2]-o.y];
    const a=point(from),b=point(to),box=o.kind==='arch'?[[ -o.half,o.half],[-.1,o.height],[-o.thick,o.thick]]:[[-o.radius,o.radius],[-.1,o.height],[-o.radius,o.radius]];
    for(let i=0;i<3;i++){
      const d=b[i]-a[i],[min,max]=box[i];if(Math.abs(d)<1e-8){if(a[i]<min||a[i]>max)return false;continue;}
      let t0=(min-a[i])/d,t1=(max-a[i])/d;if(t0>t1)[t0,t1]=[t1,t0];lo=Math.max(lo,t0);hi=Math.min(hi,t1);if(lo>hi)return false;
    }
    if(lo>.99||hi<.01)return false;
    if(o.kind==='arch'){
      // Do not fade an arch when the sightline goes through its open aperture.
      for(const t of [lo,(lo+hi)/2,hi]){
        const u=a[0]+(b[0]-a[0])*t,h=a[1]+(b[1]-a[1])*t;
        if(Math.abs(u)>=o.aperture||h>=o.spring+Math.sqrt(Math.max(0,o.aperture**2-u*u)))return true;
      }return false;
    }
    return true;
  }
  V.intersects=intersects;
  V.update=(cam,dt)=>{
    V.faded=[];V.solid=[];const p=renderPos(G.player,clamp((G.now-G.lastTick)/TICK_MS,0,1)),h=groundH(...p),from=[cam.eye[0],cam.eye[1],-cam.eye[2]];
    for(const o of WORLD.occluders||[]){
      const hiding=intersects(o,from,[p[0],h+1.2,p[1]])||intersects(o,from,[p[0],h+.6,p[1]]);
      const target=hiding?.20:1;
      o.opacity=o.opacity===undefined?target:lerp(o.opacity,target,1-Math.exp(-Math.max(dt,.016)*14));
      if(Math.abs(o.opacity-target)<.01)o.opacity=target;
      o.distance=(o.x-from[0])**2+(o.y-from[2])**2;
      (o.opacity<.99?V.faded:V.solid).push(o);
    }
    V.faded.sort((a,b)=>b.distance-a.distance);V.fadedCount=V.faded.length;
  };
  V.drawOpaque=R=>{for(const o of V.solid)for(const g of o.gpus)R.drawGPU(g);};
  V.drawFaded=R=>{
    R.setDepthWrite(false);
    for(const o of V.faded){R.gl.uniform1f(R.uOpacity,o.opacity);for(const g of o.gpus)R.drawGPU(g);}
    R.gl.uniform1f(R.uOpacity,1);R.setDepthWrite(true);
  };
  return V;
})();

'use strict';
/* Presentation adapter only. Retain the original logical panel actions and
 * projection space. The composed frame owns menus, text, orbs and cursors. */
const ClassicPresenter = (() => {
  Polish.resize=()=>{
    if(!App.glCanvas)return;
    const world=Client.world,aspect=world?world.w/world.h:VW/VH;
    const quality=Profiles.settings.quality,cap=quality==='low'?512:quality==='high'?1536:1024;
    const cssWidth=world?world.w:VW*(App.scale||1),factor=quality==='low'?1:Math.min(devicePixelRatio||1,quality==='high'?2:1.5);
    const width=Math.round(clamp(cssWidth*factor,256,cap)),height=Math.max(1,Math.round(width/aspect));
    if(App.glCanvas.width!==width)App.glCanvas.width=width;
    if(App.glCanvas.height!==height)App.glCanvas.height=height;
  };
  drawUI=(ctx,cam)=>{
    ctx.clearRect(0,0,W,H);ctx.drawImage(UI.frame,0,0);UI.tip=null;
    drawOverlays(ctx,cam);
    if(UI.bonusWin)drawBonusWindow(ctx);
    // Produces the actual rotating terrain raster consumed by the new minimap.
    drawMinimap(ctx,cam);
    drawPanel(ctx);
    // Chat and context menus are rendered once by Client, not twice in a hidden
    // 765x503 frame. This also removes the legacy eight-line scroll clamp.
  };
  drawStatsTab=(ctx,a)=>{
    const keys={Attack:'atk',Strength:'str',Defence:'def',Ranged:'rng',Magic:'mag',Prayer:'pray',Hitpoints:'hp',Mining:'mining',Woodcutting:'woodcutting',Fishing:'fishing',Cooking:'cooking',Smithing:'smithing'};
    let total=0;
    for(let i=0;i<SKILLS.length;i++){
      const x=PANEL.x+3+(i%3)*63,y=PANEL.y+4+Math.floor(i/3)*32,k=keys[SKILLS[i][0]];
      const level=k?(Expedition.active?Expedition.levelFor(Expedition.xp[k]||0):(a.stats[k]||0)):0;if(level)total+=level;
      fillR(ctx,x,y,61,30,0x403728);frameR(ctx,x,y,61,30,0x75664b);ctx.drawImage(IC['sk_'+SKILLS[i][2]],x+3,y+8);
      drawTextR(ctx,'p11',level||'--',x+56,y+20,level?0xf2d994:0x958971,true);
    }
    drawTextC(ctx,'p11','Trained total: '+total,PANEL.x+95,PANEL.y+257,0xe2d8b2,true);
  };
  return {version:Classic.version};
})();

function startGame(name,mode='arena',options={}){
  if(mode==='online'&&!options.onlineBootstrap){Online.start(name);return;}
  if(typeof Online!=='undefined'&&Online.active&&!options.onlineBootstrap){Online.stop(true);options={...options,skipSave:true};}
  if(App.mode==='game'&&!options.skipSave){
    const ok=Profiles.save();
    if(!ok&&!window.confirm('Your current profile could not be saved. Continue anyway? Export a backup to keep it.'))return;
  }
  Controls.cancelAll();Expedition.uninstallWorld();
  G.tick=0;G.now=0;G.lastTick=0;G.nextId=1;G.actors=[];G.player=null;
  G.ground=[];G.projs=[];G.effects=[];G.msgs=[];G.hitQ=[];G.dialog=null;G.spellSel=null;
  for(const k of ['kills','deaths','streak','best','dmgDealt','dmgTaken','chatScroll'])G[k]=0;
  Profiles.select(name,mode);createPlayer();G.player.name=Profiles.name;G.player.loadoutKind='main';createClerks();UI.botCount=0;
  Expedition.begin(Profiles.mode);
  if(!Expedition.active)setBotCount(6);
  const saved=options.onlineBootstrap?null:Profiles.read();if(saved)Profiles.apply(saved);
  UI.tab=3;UI.menu=null;UI.drag=null;UI.chatInput='';UI.bonusWin=false;UI.mouse={x:-100,y:-100};
  G.player.protectUntil=G.tick+25;App.mode='game';App.manualPause=false;App.prev=performance.now();
  Polish.snapCamera=true;Polish.particles.length=0;App.cam._visibleDist=App.cam.dist;
  Client.close();Client.layout();
  if(!options.onlineBootstrap){gameMsg('Welcome, '+Profiles.name+'. '+(Expedition.active?'Your expedition begins at the safe camp.':'You are in the offline PvP practice arena.'));
  gameMsg(Expedition.active?'Journal marks gathering spots and enemy camps. Bank your supplies; craft at the forge.':'Free combat kits are available at bank booths. Bots and specials use the 600 ms game tick.');}
  if(Profiles.blocked)gameMsg(Profiles.status);
}

function fatal(err){
  if(App.error)return;App.error=err;console.error(err);App.mode='error';Controls.cancelAll();
  const box=document.createElement('section');box.style.cssText='position:fixed;inset:20px;z-index:100;background:#1b2c22;color:#eadfbf;padding:24px;border:1px solid #cfb777;overflow:auto;font:16px system-ui';
  const title=document.createElement('h2');title.textContent='The game could not continue';box.appendChild(title);

  const b=document.createElement('button');b.textContent='Reload';b.onclick=()=>location.reload();box.appendChild(b);document.body.appendChild(box);
}
function frame(t){
  requestAnimationFrame(frame);
  if(App.error)return;
  try{
    let elapsed=App.prev?t-App.prev:0;App.prev=t;
    if(!Number.isFinite(elapsed)||elapsed<0||elapsed>3000)elapsed=0;
    if(App.mode==='load'){drawLoading(App.ctx);return;}
    if(App.mode!=='game')return;
    const paused=document.hidden||App.contextLost||(!Online.active&&(!!Client.panel||App.manualPause));
    const dt=paused?0:Math.min(.1,elapsed/1000);
    Online.frame();
    if(!paused){
      G.now+=elapsed;
      let steps=0;while(G.now-G.lastTick>=TICK_MS&&steps<4){G.lastTick+=TICK_MS;gameTick();steps++;}
      // Drop an extreme backlog rather than spending seconds in catch-up.
      if(G.now-G.lastTick>=TICK_MS)G.lastTick=G.now;
      if(performance.now()-Profiles.lastSave>15000){Profiles.lastSave=performance.now();Profiles.save();}
    }
    if(App.contextLost)return;
    const frac=clamp((G.now-G.lastTick)/TICK_MS,0,1),cam=App.cam;
    if(!paused&&!Client.panel)updateCameraKeys(dt);
    const rp=renderPos(G.player,frac);Polish.camera(cam,rp,groundH(...rp),dt);
    drawDynamic(frac,dt,cam);updateScreenInfo(cam,frac);
    const R=App.R;R.begin(cam);R.gl.uniform1f(R.uOpacity,1);WorldVisibility.update(cam,dt);for(const g of WORLD.statics)R.drawGPU(g);Polish.drawExtra();WorldVisibility.drawOpaque(R);Polish.drawShadows();
    R.drawDynamic(DYN);R.setDepthWrite(false);R.drawDynamic(BLD);R.setDepthWrite(true);WorldVisibility.drawFaded(R);
    if(!paused)updateHover();drawUI(App.ctx,cam);Client.draw();
  }catch(err){fatal(err);}
}
async function boot(){
  const ui=document.getElementById('ui'),glc=document.getElementById('gl');
  App.ctx=ui.getContext('2d');if(!App.ctx)throw new Error('Canvas 2D is unavailable.');
  App.ctx.imageSmoothingEnabled=false;App.glCanvas=glc;INP.canvas=ui;INP.glCanvas=glc;
  Profiles.loadSettings();Client.init();fit();addEventListener('resize',fit);window.fitClient=fit;
  if(window.visualViewport)window.visualViewport.addEventListener('resize',fit);
  let timer;try{await Promise.race([initFonts(),new Promise((_,reject)=>{timer=setTimeout(()=>reject(new Error('Embedded font loading timed out.')),15000);})]);}finally{clearTimeout(timer);}
  requestAnimationFrame(frame);
  const steps=[
    ['Preparing renderer',()=>{App.R=new Renderer(glc);Polish.configure();}],
    ['Building the Grand Exchange',()=>{COL.grass=0x65794d;COL.grass2=0x89945c;buildWorld(App.R);initLoS();}],
    ['Preparing interface',()=>{buildAllIcons();buildFrame();}],
    ['Preparing items',()=>{for(const id of Object.keys(ITEMS))itemIcon(id);}],
    ['Detailing the world',()=>Polish.buildScenery()],
    ['Preparing camera',()=>{App.cam=new Camera();App.cam.yaw=0;App.cam.pitch=.88;App.cam.dist=15;INP.cam=App.cam;}]
  ];
  for(let i=0;i<steps.length;i++){App.status=steps[i][0];App.progress=i/steps.length;await tick();await tick();steps[i][1]();}
  App.progress=1;Controls.bind();fit();
  glc.addEventListener('webglcontextlost',e=>{
    e.preventDefault();Profiles.save();App.contextLost=true;Controls.cancelAll();Profiles.status='Graphics context lost. Your local save was attempted; reload to rebuild the renderer.';
    Client.open('menu');const b=document.createElement('button');b.textContent='Reload renderer';b.onclick=()=>location.reload();Client.root.appendChild(b);
  });
  document.addEventListener('visibilitychange',()=>{App.prev=performance.now();});
  App.mode='login';Client.open('welcome');
  const q=new URLSearchParams(location.search);if(q.get('auto')==='1')startGame(q.get('profile')||'Leefy',q.get('mode')||'arena',{skipSave:true});
}
boot().catch(fatal);

</script></body></html>
