name: Verify game
on:
  push:
    branches: [main, leefy-foundation, oldskool-online, oldskool-repair]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Detect regression harness
        id: source
        shell: bash
        run: |
          if [ -f package-lock.json ]; then echo 'ready=true' >> "$GITHUB_OUTPUT"; else echo 'ready=false' >> "$GITHUB_OUTPUT"; fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.source.outputs.ready == 'true'
      - name: Verify Rust authoritative server
        if: steps.source.outputs.ready == 'true'
        run: cargo test --manifest-path server/Cargo.toml && cargo build --release --manifest-path server/Cargo.toml
      - name: Check and build original foundation
        if: steps.source.outputs.ready != 'true'
        run: |
          for file in src/*.js; do node --check "$file"; done
          python3 tools/build.py
      - if: steps.source.outputs.ready == 'true'
        run: npm ci --ignore-scripts
      - if: steps.source.outputs.ready == 'true'
        run: npm run check && npm test && npm run build
      - if: steps.source.outputs.ready == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.source.outputs.ready == 'true'
        run: npm run test:browser
      - name: Two-client Rust multiplayer integration
        if: steps.source.outputs.ready == 'true'
        run: npm run test:online
      - name: Simulated World 1 resident population
        if: steps.source.outputs.ready == 'true'
        run: npm run test:crowd
      - name: Movement, reconnection and scene regression
        if: steps.source.outputs.ready == 'true'
        run: npm run test:repair
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-and-qa
          path: |
            dist/index.html
            qa/
          retention-days: 14
  publish-generated:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/leefy-foundation' || github.ref == 'refs/heads/oldskool-online')
    needs: regression
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the verified standalone client
        run: python3 tools/build.py
      - name: Publish only generated HTML without overwriting newer work
        env:
          EXPECTED_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          git add -- dist/index.html dev.html
          if [ -f index.html ]; then git add -- index.html; fi
          if git diff --cached --quiet; then exit 0; fi
          git fetch origin "$TARGET_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" != "$EXPECTED_SHA" ]; then
            echo 'Branch advanced; leaving newer work untouched.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Rebuild verified standalone client'
          git push origin HEAD:"refs/heads/$TARGET_BRANCH"
