<title>Deepmere</title>

<style>
[hidden]{display:none!important}
/* Layout: full-bleed 3D canvas; HUD pinned to the four corners inside a 16px gutter, thumbs at the bottom. */
:root {
  color-scheme: dark;
  --sky: #b8d4e6; --panel: rgba(21, 23, 29, .88); --panel-solid: #171a20; --line: #3b3e49; --line-soft: rgba(255, 255, 255, .08);
  --text: #f3f0e8; --dim: #b5b9c4; --gold: #ffc23d; --gold-deep: #6d5a22; --hp: #e23d2e; --en: #3d8fe6;
  --orange: #ff7a3d; --green: #5fd36f; --blue: #5bb8ff; --cyan: #7fd9ff; --bad: #ff6a5a;
  --display: 'Rubik', 'Segoe UI', Roboto, system-ui, sans-serif; --body: 'Rubik', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --b: clamp(42px, calc((100vw - 96px) / 6), 60px); --gap: 8px;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--sky); color: var(--text); font-family: var(--body); overflow: hidden; overscroll-behavior: none; }
#app { position: relative; height: 100%; width: 100%; overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
#gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#labels, #flash { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
#flash { background: #fff; opacity: 0; }
.wl { position: absolute; left: 0; top: 0; font: 700 15px/1 var(--display); letter-spacing: .02em; white-space: nowrap; text-shadow: 0 1px 0 #0b0c10, 0 -1px 0 #0b0c10, 1px 0 0 #0b0c10, -1px 0 0 #0b0c10, 0 2px 6px rgba(0, 0, 0, .55); will-change: transform; }
.wl.npc { color: var(--cyan); } .wl.you { color: var(--gold); } .wl.rig { color: var(--orange); } .wl.camp { color: var(--green); letter-spacing: .08em; } .wl.float { font-size: 16px; }
#joy { position: absolute; width: 112px; height: 112px; margin: -56px 0 0 -56px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, .35); background: rgba(20, 22, 28, .25); pointer-events: none; }
#joy i { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%; background: rgba(255, 255, 255, .55); }

#hud { position: absolute; inset: 0; pointer-events: none; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; }
#hud button, #mini { pointer-events: auto; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: none; -webkit-tap-highlight-color: transparent; }
button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.panel { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; }
#top { display: flex; gap: 6px; align-items: stretch; }
#bars { flex: 1.25 1 0; min-width: 0; max-width: 250px; padding: 6px; display: flex; flex-direction: column; gap: 5px; justify-content: center; }
.bar { position: relative; height: 19px; border-radius: 8px; background: #0e0f13; overflow: hidden; font: 700 11px/19px var(--display); letter-spacing: .07em; }
.bar b { position: absolute; inset: 0; width: 100%; transform-origin: 0 50%; border-radius: 8px; }
.bar.hp b { background: linear-gradient(#f2584a, var(--hp)); } .bar.en b { background: linear-gradient(#5aa8f5, var(--en)); }
.bar span { position: absolute; left: 8px; } .bar em { position: absolute; right: 8px; font-style: normal; font-size: 13px; font-variant-numeric: tabular-nums; }
#stats { flex: 1.3 1 0; min-width: 0; max-width: 250px; display: flex; justify-content: space-around; align-items: center; padding: 4px 6px; }
#stats div { display: flex; flex-direction: column; align-items: center; min-width: 0; }
#stats b { font: 700 19px/1.1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
#stats span { font: 500 9px/1.2 var(--display); letter-spacing: .12em; color: var(--dim); }

.sq svg { width: 58%; height: 58%; }
.sq:active, .round:active, .pill:active { transform: scale(.94); }

.sq .n { position: absolute; right: 5px; bottom: 2px; font: 700 13px/1 var(--display); font-variant-numeric: tabular-nums; text-shadow: 0 1px 2px #000; }
.sq.empty svg { opacity: .35; }
#top .sq { width: 42px; height: auto; min-height: 42px; border-radius: 14px; }
#mid { flex: 1; position: relative; min-height: 0; }
#mini { position: absolute; right: 0; top: 8px; width: clamp(84px, 24vw, 132px); height: clamp(84px, 24vw, 132px); border-radius: 50%; border: 2px solid var(--line); background: var(--panel-solid); box-shadow: 0 2px 10px rgba(0, 0, 0, .35); }
#quest { position: absolute; left: 0; top: 8px; max-width: calc(100% - clamp(84px, 24vw, 132px) - 12px); padding: 6px 10px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); font: 500 12.5px/1.25 var(--body); }
#quest b { color: var(--gold); font-weight: 700; } #quest small { display: block; color: var(--dim); font-size: 10px; letter-spacing: .12em; }

#feed i { width: 10px; height: 10px; border-radius: 3px; display: block; }
#toasts { position: absolute; left: 50%; top: 30%; transform: translateX(-50%); width: min(86%, 380px); display: flex; flex-direction: column; gap: 6px; align-items: center; }
#toasts div { padding: 8px 14px; border-radius: 12px; background: var(--panel); border: 2px solid var(--line); font: 500 13.5px/1.3 var(--body); text-align: center; transition: opacity .4s, transform .4s; }
#toasts .gold { border-color: var(--gold); color: var(--gold); font-weight: 700; } #toasts .bad { border-color: var(--bad); color: var(--bad); }
#ctx { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); padding: 11px 18px; border-radius: 14px; background: #1b3350; border: 2px solid var(--blue); color: #eaf6ff; font: 700 14px/1 var(--display); white-space: nowrap; box-shadow: 0 0 16px rgba(91, 184, 255, .5); }
#side { position: absolute; right: 0; bottom: 8px; display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
.round { width: calc(var(--b) * 1.05); height: calc(var(--b) * 1.05); border-radius: 50%; padding: 0; background: var(--panel); border: 2px solid var(--line); color: var(--text); display: grid; place-items: center; }
.round svg { width: 54%; height: 54%; }
.round.big { width: calc(var(--b) * 1.55); height: calc(var(--b) * 1.55); border-color: var(--gold); color: var(--gold); background: rgba(60, 48, 16, .88); box-shadow: 0 0 14px rgba(255, 194, 61, .35); }
.round.held { transform: scale(.93); filter: brightness(1.3); }
#bottom { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.cluster { display: flex; flex-direction: column; gap: 6px; }
.row { display: flex; gap: var(--gap); }
.lbl { font: 700 11px/1 var(--display); letter-spacing: .16em; color: #e8e6df; text-shadow: 0 1px 3px rgba(0, 0, 0, .8); padding: 3px 2px 0; }
.lbl.r { text-align: right; }
.pill { height: var(--b); width: 100%; border-radius: 16px; padding: 0 12px; display: flex; align-items: center; gap: 10px; background: linear-gradient(rgba(109, 90, 34, .92), rgba(78, 64, 22, .92)); border: 2px solid #8f7a35; color: var(--gold); text-align: left; position: relative; overflow: hidden; }
.pill svg { width: 30px; height: 30px; flex: none; }
.pill span { display: flex; flex-direction: column; min-width: 0; }
.pill b { font: 700 clamp(13px, 4vw, 17px)/1.1 var(--display); white-space: nowrap; } .pill small { font: 500 12px/1.2 var(--display); color: #e6d59a; font-variant-numeric: tabular-nums; }
.pill.ready { border-color: var(--gold); box-shadow: 0 0 18px rgba(255, 194, 61, .7); animation: pulse 1.1s ease-in-out infinite; }
@keyframes pulse { 50% { filter: brightness(1.35); } }
@media (prefers-reduced-motion: reduce) { .pill.ready { animation: none; } }

#modal { position: absolute; inset: 0; background: rgba(8, 10, 14, .55); display: grid; place-items: center; padding: 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); touch-action: auto; }
#card { width: min(100%, 430px); max-height: 100%; overflow-y: auto; background: var(--panel-solid); border: 2px solid var(--line); border-radius: 20px; padding: 18px; box-shadow: 0 18px 50px rgba(0, 0, 0, .5); touch-action: pan-y; }
#card h1 { margin: 0; font: 700 34px/1 var(--display); color: var(--gold); letter-spacing: .01em; }
#card h2 { margin: 0 0 12px; font: 700 20px/1.1 var(--display); display: flex; justify-content: space-between; align-items: center; gap: 10px; }
#card h3 { margin: 16px 0 8px; font: 700 11px/1 var(--display); letter-spacing: .16em; color: var(--dim); }
#card p { margin: 8px 0; font-size: 14px; line-height: 1.45; color: var(--dim); }
#card .tag { color: var(--text); font-size: 15px; }
.btn { display: block; width: 100%; padding: 13px 14px; border-radius: 14px; border: 2px solid var(--line); background: #232730; color: var(--text); font: 700 15px/1 var(--display); margin-top: 8px; touch-action: manipulation; }
.btn.go { background: linear-gradient(#7a6526, #5a4a1a); border-color: var(--gold); color: var(--gold); }
.btn.warn { border-color: var(--bad); color: var(--bad); }
.x { flex: none; width: 36px; height: 36px; border-radius: 12px; border: 2px solid var(--line); background: #232730; color: var(--text); font: 700 16px/1 var(--display); touch-action: manipulation; }
.how { display: grid; grid-template-columns: auto 1fr; gap: 7px 12px; margin: 12px 0 4px; font-size: 13.5px; line-height: 1.35; color: var(--dim); align-items: center; }
.how b { color: var(--text); font-weight: 700; white-space: nowrap; }
.item { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line-soft); }
.item:first-of-type { border-top: 0; }
.item > div { flex: 1; min-width: 0; } .item b { display: block; font: 700 14.5px/1.2 var(--display); } .item small { display: block; color: var(--dim); font-size: 12.5px; line-height: 1.3; }
.item button { flex: none; min-width: 78px; padding: 10px 10px; border-radius: 12px; border: 2px solid #8f7a35; background: rgba(109, 90, 34, .5); color: var(--gold); font: 700 13.5px/1 var(--display); font-variant-numeric: tabular-nums; touch-action: manipulation; }
.item button.off { border-color: var(--line); color: var(--dim); background: #232730; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.tile { padding: 8px 4px 7px; border-radius: 14px; border: 2px solid var(--line); background: #1f232b; display: flex; flex-direction: column; align-items: center; gap: 3px; touch-action: manipulation; }
.tile svg { width: 34px; height: 34px; } .tile b { font: 700 12px/1.1 var(--display); text-align: center; } .tile small { color: var(--gold); font: 700 12px/1 var(--display); font-variant-numeric: tabular-nums; }
.grid p { grid-column: 1 / -1; margin: 0; }
.tile.on { border-color: var(--blue); background: #1b3350; }
.coins { color: var(--gold); font: 700 15px/1 var(--display); font-variant-numeric: tabular-nums; }
@media (min-width: 720px) { #bars, #stats { flex: 0 1 230px; } #top { justify-content: flex-start; } #top .sq:first-of-type { margin-left: auto; } }
</style>

</div>

  g.fillStyle = '#3d74b8'; g.fillRect(0, 0, S, S); g.save(); g.beginPath(); g.arc(h, h, h, 0, 7); g.clip(); g.translate(h, h); g.rotate(cam.yaw); g.scale(sc, sc); g.imageSmoothingEnabled = false; g.drawImage(mapC, -b.x, -b.z);

  for (const n of npcs) dot(n.x, n.z, '#7fd9ff', 2.2); if (!P.mounted) dot(rig.x, rig.z, '#ff7a3d', 2.4);
  g.rotate(-b.face + Math.PI); g.fillStyle = '#fff'; g.strokeStyle = '#14161b'; g.lineWidth = .8; g.beginPath(); g.moveTo(0, -4.2); g.lineTo(3, 3); g.lineTo(0, 1.4); g.lineTo(-3, 3); g.closePath(); g.fill(); g.stroke(); g.restore();

/* ---- HUD ---- */
const hudC = {};

  $('bDyn').innerHTML = ico('dyn', '#ff8a4a') + '<span class="n" id="nDyn" style="color:#ff8a4a"></span>'; $('bRation').innerHTML = ico('ration', '#6cc0ff') + '<span class="n" id="nRat" style="color:#6cc0ff"></span>';
  $('bHammer').innerHTML = ico('star') + '<span><b>Sky Hammer</b><small id="hamV">0%</small></span>';

  const press = (id, fn) => $(id).addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); audioInit(); fn(e); });

  press('bDyn', () => { if (!paused) throwDynamite(); }); press('bRation', () => { if (!paused) eatRation(); }); press('bHammer', () => { if (!paused) skyHammer(); });
  press('ctx', () => { if (!paused) doInteract(); });

  for (let i = 0; i < 3; i++) press('s_' + i, () => { if (P.mode === 'build' && P.slot === i) openBag(); else { P.mode = 'build'; P.slot = i; task = null; } });

function hudUpdate() {

  setT('hpV', hp); setT('enV', en); setT('sLvl', P.lvl); setT('sCoin', P.coins); setT('sDepth', (P.depth | 0) + 'm'); setT('nDyn', P.dyn); setT('nRat', P.ration); setT('hamV', (P.charge | 0) + '%');

  if (hudC.hf !== hf) { hudC.hf = hf; $('hpF').style.transform = `scaleX(${Math.max(0, hf)})`; } if (hudC.ef !== ef) { hudC.ef = ef; $('enF').style.transform = `scaleX(${ef})`; }

/* ---- modals ---- */
function showCard(html) { $('card').innerHTML = html; $('modal').hidden = false; paused = true; input.jx = input.jy = 0; input.use = input.jump = false; input.hold = null; $('joy').hidden = true; }

const HOW = `<div class="how"><b>Drag</b><span>anywhere to walk</span><b>Tap a block</b><span>dig it, or build on it</span><b>Hold</b><span>to keep digging where you point</span><b>USE button</b><span>dig or build straight ahead</span><b>Two fingers</b><span>turn the camera, pinch to zoom</span><b>Keyboard</b><span>WASD, Space, mouse, Q/E turn, 1-6 tools, G dynamite, F interact</span></div>`;
function openTitle() {
  showCard(`<h1>Deepmere</h1><p class="tag">An island you can dig up, blow apart and rebuild, one block at a time.</p>${HOW}
  <button class="btn go" id="mStart">${hadSave ? 'Keep digging' : 'Start digging'}</button>${hadSave ? '<button class="btn" id="mNew">New island</button>' : ''}`);
  $('mStart').onclick = () => { audioInit(); started = true; $('hud').hidden = false; closeModal(); if (!hadSave) toast('Welcome to Deepmere Camp. Pick a tool and start digging!', 'gold'); };
  if (hadSave) $('mNew').onclick = () => confirmNew(openTitle);
}
function confirmNew(back) {
  showCard(`<h2>New island?</h2><p>This replaces your current island, tools and coins with a fresh one. It cannot be undone.</p><button class="btn warn" id="mYes">Start a new island</button><button class="btn" id="mNo">Keep my island</button>`);
  $('mNo').onclick = back;
  $('mYes').onclick = () => { $('card').innerHTML = '<h1>Deepmere</h1><p class="tag">Carving a new island…</p>'; setTimeout(() => { newGame((Math.random() * 1e9) | 0); spawnCritters(); initMap(); hadSave = false; saveGame(); audioInit(); started = true; $('hud').hidden = false; onQuest(); closeModal(); }, 40); };
}
function openPause() {
  showCard(`<h2>Paused <button class="x" id="mX" aria-label="Close">✕</button></h2>${HOW}
  <button class="btn go" id="mRes">Back to the island</button><button class="btn" id="mSnd">Sound: ${soundOn ? 'on' : 'off'}</button><button class="btn" id="mSave">Save now</button><button class="btn warn" id="mNew">New island</button>`);
  $('mX').onclick = $('mRes').onclick = closeModal; $('mSnd').onclick = () => { soundOn = !soundOn; openPause(); };
  $('mSave').onclick = () => { $('mSave').textContent = saveGame() ? 'Saved on this device' : 'Could not save - storage is blocked here'; }; $('mNew').onclick = () => confirmNew(openPause);
}
function openBag() {
  const tile = id => `<button class="tile${P.slots[P.slot] === id ? ' on' : ''}" data-id="${id}">${cube(id)}<b>${BL[id].name}</b><small>${P.inv[id]}${BL[id].val ? ' · ' + BL[id].val + 'c' : ''}</small></button>`;
  const blocks = [], ores = []; for (let id = 1; id < NB; id++) if (P.inv[id] > 0) (BL[id].ore ? ores : blocks).push(id);
  showCard(`<h2>Bag <button class="x" id="mX" aria-label="Close">✕</button></h2>
  <h3>BLOCKS · TAP ONE TO BUILD WITH IT (SLOT ${P.slot + 1})</h3><div class="grid">${blocks.map(tile).join('') || '<p>No blocks yet. Dig some up.</p>'}</div>
  <h3>ORE · WORTH ${oreValue()} COINS AT THE MERCHANT</h3><div class="grid">${ores.map(tile).join('') || '<p>None yet. Ore is the speckled rock underground.</p>'}</div>
  <h3>GEAR</h3><p>${PICKS[P.pick].n} · Drill Mk ${P.drill + 1} · ${P.dyn} dynamite · ${P.ration} rations${P.jet ? ' · Jetpack' : ''}</p>`);
  $('mX').onclick = closeModal;

openShop = who => {
  const items = shopItems(who);
  showCard(`<h2>${who === 'merchant' ? 'Merchant' : 'Smith'} <span class="coins">${P.coins} coins</span><button class="x" id="mX" aria-label="Close">✕</button></h2>` + items.map(it =>
    `<div class="item"><div><b>${it.name}</b><small>${it.desc}</small></div><button data-id="${it.id}" class="${it.owned || (it.cost && P.coins < it.cost) || (it.id === 'sell' && !it.gain) ? 'off' : ''}">${it.owned ? 'Owned' : it.id === 'sell' ? 'Sell +' + it.gain : it.cost + ' coins'}</button></div>`).join(''));
  $('mX').onclick = closeModal;

/* ---- input ---- */
const ptrs = new Map(); let joyId = null, holdId = null;
function canvasXY(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
function setHold(p) { holdId = p.id; input.hold = { x: p.x, y: p.y }; }
function endPtr(id) {
  if (joyId === id) { joyId = null; input.jx = input.jy = 0; $('joy').hidden = true; }
  if (holdId === id) { holdId = null; input.hold = null; }
  ptrs.delete(id);
}
function initInput() {
  cv.addEventListener('contextmenu', e => e.preventDefault());
  cv.addEventListener('pointerdown', e => {
    e.preventDefault(); audioInit(); if (paused) return; try { cv.setPointerCapture(e.pointerId); } catch (x) { }
    const [x, y] = canvasXY(e), now = performance.now(), p = { id: e.pointerId, mode: 'cand', sx: x, sy: y, x, y, t0: now, mouse: e.pointerType === 'mouse' };
    if (p.mouse) { if (e.button !== 0) p.mode = 'cam'; else { p.mode = 'hold'; setHold(p); } }
    else for (const q of ptrs.values()) if (!q.mouse && (q.mode === 'cand' || q.mode === 'cam' || (q.mode === 'joy' && now - q.t0 < 260))) { if (q.mode === 'joy') { joyId = null; input.jx = input.jy = 0; $('joy').hidden = true; } q.mode = 'cam'; p.mode = 'cam'; }
    ptrs.set(p.id, p);
  });
  cv.addEventListener('pointermove', e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const [x, y] = canvasXY(e), dx = x - p.x, dy = y - p.y; p.x = x; p.y = y;
    if (p.mode === 'cand' && Math.hypot(x - p.sx, y - p.sy) > 13) { if (joyId === null) { p.mode = 'joy'; joyId = p.id; const j = $('joy'); j.hidden = false; j.style.left = p.sx + 'px'; j.style.top = p.sy + 'px'; } else { p.mode = 'hold'; setHold(p); } }
    if (p.mode === 'joy') { let jx = (x - p.sx) / 52, jy = (y - p.sy) / 52; const l = Math.hypot(jx, jy); if (l > 1) { jx /= l; jy /= l; } input.jx = jx; input.jy = -jy; $('joy').firstChild.style.transform = `translate(${jx * 34}px,${jy * 34}px)`; }
    else if (p.mode === 'hold' && holdId === p.id) { input.hold.x = x; input.hold.y = y; }
    else if (p.mode === 'cam') {
      const cams = [...ptrs.values()].filter(q => q.mode === 'cam');
      if (cams.length >= 2) { const o = cams[0] === p ? cams[1] : cams[0], d1 = Math.hypot(x - o.x, y - o.y), d0 = Math.hypot(x - dx - o.x, y - dy - o.y); if (d0 > 10) cam.dist = clamp(cam.dist * d0 / d1, 10, 62); camYawT -= dx * .004; cam.yaw -= dx * .004; camPitchOff = clamp(camPitchOff + dy * .003, -.45, .5); }
      else { camYawT -= dx * .008; cam.yaw -= dx * .008; camPitchOff = clamp(camPitchOff + dy * .005, -.45, .5); }
    }
  });
  const up = e => {
    const p = ptrs.get(e.pointerId); if (!p) return; const dur = performance.now() - p.t0;
    if (!paused && e.type === 'pointerup' && (p.mode === 'cand' || (p.mouse && p.mode === 'hold' && dur < 240 && Math.hypot(p.x - p.sx, p.y - p.sy) < 8))) { endPtr(p.id); tapWorld(p.sx, p.sy); return; }
    endPtr(p.id);
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); cam.dist = clamp(cam.dist * (e.deltaY > 0 ? 1.1 : .9), 10, 62); }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.repeat) return; input.keys[e.code] = true; audioInit();
    if (e.code === 'Escape') { if ($('modal').hidden) openPause(); else if (started) closeModal(); return; }
    if (paused) return;
    const d = e.code.startsWith('Digit') ? +e.code.slice(5) : 0;
    if (d >= 1 && d <= 3) { P.mode = TOOLS[d - 1][0]; task = null; } else if (d >= 4 && d <= 6) { P.mode = 'build'; P.slot = d - 4; task = null; }
    else if (e.code === 'KeyG') throwDynamite(); else if (e.code === 'KeyR') eatRation(); else if (e.code === 'KeyH') skyHammer(); else if (e.code === 'KeyF') doInteract(); else if (e.code === 'KeyB') openBag();
    else if (e.code === 'KeyQ') camYawT += Math.PI / 4; else if (e.code === 'KeyE') camYawT -= Math.PI / 4; else if (e.code === 'Enter') input.use = true;
    if (e.code === 'Space') e.preventDefault();
  });

  window.addEventListener('blur', () => { input.keys = {}; input.use = input.jump = false; });
}
function promoteHolds() { const now = performance.now(); for (const p of ptrs.values()) if (p.mode === 'cand' && now - p.t0 > 250 && holdId === null) { p.mode = 'hold'; setHold(p); } }

/* ---- main.js ---- */
'use strict';
/* ==========================================================================
   main.js - boot and main loop
   ========================================================================== */
let lastT = 0, booted = false;
function frame(t) {
  requestAnimationFrame(frame);
  const dt = Math.min(.05, Math.max(0, (t - lastT) / 1000)); lastT = t;
  if (!booted) return;
  if (!paused) { promoteHolds(); update(dt); }
  const b = body(), k = 1 - Math.exp(-dt * 9);
  cam.tx += (b.x - cam.tx) * k; cam.tz += (b.z - cam.tz) * k; cam.ty += (b.y - b.lift + 1.1 - cam.ty) * (1 - Math.exp(-dt * 6));
  cam.yaw += (camYawT - cam.yaw) * (1 - Math.exp(-dt * 10));
  cam.pitch += (clamp((cut.on ? 1.04 : .84) + camPitchOff, .35, 1.4) - cam.pitch) * (1 - Math.exp(-dt * 4));
  remeshDirty(6, b.x, b.z);
  const hi = buildScene();
  renderFrame(t / 1000, [b.x, b.y, b.z], hi);
  if (started) { hudUpdate(); updateLabels(dt); drawMini(dt); }
  if (!paused) { saveAcc += dt; if (saveAcc > 40) { saveAcc = 0; if (World.dirty) saveGame(); } }
}
function boot() {
  try { initGL(); } catch (e) { $('card').innerHTML = '<h1>Deepmere</h1><p class="tag">This browser could not start 3D graphics (WebGL 2). Try a recent Chrome, Safari or Firefox.</p>'; return; }
  hadSave = loadGame();
  if (!hadSave) newGame((Math.random() * 1e9) | 0);
  spawnCritters(); initMap(); buildHud(); initLabels(); initInput();
  const b = body(); cam.tx = b.x; cam.ty = b.y + 1.1; cam.tz = b.z; camYawT = cam.yaw;
  remeshDirty(1e9, b.x, b.z);
  booted = true; openTitle();
  document.addEventListener('visibilitychange', () => { if (document.hidden && started && World.dirty) saveGame(); });
  window.addEventListener('pagehide', () => { if (started && World.dirty) saveGame(); });
}
requestAnimationFrame(frame);
setTimeout(boot, 30);

</script>
